# nginx site config for demo.zakaz.ezbook.ru — демо-стенд «EZBOOK Заказы» (цикл 35, T-35-40; ARCHITECTURE_CYCLE35.md §35.14.1, DEPLOY.md §27)
# Copy to /etc/nginx/sites-available/demo.zakaz.ezbook.conf on the VPS, symlink into sites-enabled,
# then run `certbot --nginx -d demo.zakaz.ezbook.ru` to add TLS (it rewrites the server block below to add
# the certificate + a port-443 server block, same convention as demo.visit.ezbook.conf / goods.ezbook.conf; HTTP-01, отдельный сертификат).
# Re-copying this file over the installed one drops certbot's 443 block: rerun certbot right after.
#
# Тот же сервер, сборка goods из ТОГО ЖЕ релиза (/var/www/ezbook/current/__goods — деплой и откат переключают все сайты одним
# symlink'ом), но API — тот же контейнер api-demo на 127.0.0.1:5001, что у demo.visit (docker-compose.demo.yml): один API на два vhost.
#
# Имена map/log_format ниже УНИКАЛЬНЫ (demo_zakaz_*): nginx не стартует, если те же имена объявлены в goods.ezbook.conf (goods_*).
# Закрыт от индексации: X-Robots-Tag на всех location, /robots.txt с Disallow.
# Вебхуки провайдеров, отписка и MAX-бот на демо закрыты 404 (провайдеры logging/stub).

# Токен заказа — секрет доступа к заказу: в пути /o/<token>, в пути API /api/orders/public/<token> и в Referer. Маскируем в логе.
map $request_uri $demo_zakaz_safe_uri {
    ~^(?<dz_uri_prefix>/(?:api/orders/public|o)/)[^/?]+(?<dz_uri_rest>.*)$ "${dz_uri_prefix}MASKED${dz_uri_rest}";
    default $request_uri;
}
map $http_referer $demo_zakaz_safe_referer {
    ~^(?<dz_ref_prefix>https?://[^/]+/o/)[^/?#]+(?<dz_ref_rest>.*)$ "${dz_ref_prefix}MASKED${dz_ref_rest}";
    default $http_referer;
}
log_format demo_zakaz_masked '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $demo_zakaz_safe_uri $server_protocol" '
                             '$status $body_bytes_sent "$demo_zakaz_safe_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name demo.zakaz.ezbook.ru;

    root /var/www/ezbook/current/__goods;
    index index.html;
    access_log /var/log/nginx/demo-zakaz.access.log demo_zakaz_masked;

    client_max_body_size 6M;   # как на goods: фото товара до 5 МБ

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Вебхуки/отписка/бот верификации телефона: на демо 404 (longest-prefix ^~ побеждает /api/ ниже).
    location ^~ /api/phone-verification/ { return 404; }
    location ^~ /api/notifications/provider-webhook/ { return 404; }
    location ^~ /api/notifications/unsubscribe/ { return 404; }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Само API демо отдаёт X-Robots-Tag тоже; скрываем, чтобы не было дубля — свой добавляет nginx (уровень server).
        proxy_hide_header X-Robots-Tag;
    }

    # goods как приложение: service worker и манифест без кеша браузера (те же заголовки, что в goods.ezbook.conf,
    # иначе плашка «Доступна новая версия» не работает).
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: /<slug>, /o/<token>, /cabinet/... — всё на index.html. Виджета-iframe нет → кадрирование запрещено.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://smartcaptcha.yandexcloud.net; frame-src https://smartcaptcha.yandexcloud.net; connect-src 'self' https://smartcaptcha.yandexcloud.net; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Повторены с уровня server намеренно: add_header не наследуется, если в location есть свой.
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Для локаций без своих add_header (/uploads/ и ответы nginx).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
