# nginx site config for errors.ezbook.ru — reverse proxy to self-hosted GlitchTip
# (docker-compose.glitchtip.yml, `web` service, bound to 127.0.0.1:8000 only — never publish that
# port itself, this file is the only intended way in from outside the machine).
#
# Copy to /etc/nginx/sites-available/errors.ezbook.conf on the VPS, symlink into sites-enabled,
# then run `certbot --nginx -d errors.ezbook.ru` (DEPLOY.md §12) to add TLS — same convention as
# ezbook.conf: certbot rewrites the server blocks below to add the certificate and a port-443
# server block automatically, no manual `listen 443 ssl` needed here.
#
# Basic-auth in front of GlitchTip's own login (see DEPLOY.md §12 for how to set the password
# file) — GlitchTip shows production error payloads, which can carry fragments of real user data
# (stack traces, request bodies), so this is a second gate in front of GlitchTip's own
# authentication, not a replacement for it. GlitchTip's own open registration is also disabled
# separately (ENABLE_OPEN_USER_REGISTRATION: "false" in docker-compose.glitchtip.yml) — the two
# are independent layers on purpose: basic-auth stops an anonymous internet scanner from even
# reaching the login page, ENABLE_OPEN_USER_REGISTRATION stops someone who does reach it from
# self-registering an account.
server {
    listen 80;
    server_name errors.ezbook.ru;
    # No `listen [::]:80` here (unlike ezbook.conf): this VPS has no working IPv6 route (already
    # caused docker pull failures once) — an IPv6 listener would accept connections nginx can
    # never actually complete a TCP handshake back out on, which is a strictly worse failure mode
    # than not listening at all. Matches the plain HTTP-01 flow certbot needs on port 80 either way.

    # Приём событий от приложений — БЕЗ basic-auth, и это не послабление.
    #
    # На этот же поддомен ходит не только человек браузером, но и Sentry-клиент внутри API
    # (Sentry__Dsn) и скрипты бэкапа/монитора. Про логин и пароль от basic-auth они не знают и
    # знать не могут — DSN их не содержит. Если оставить `auth_basic` на этих путях, каждое
    # событие отбивается 401, трекер остаётся пустым, и это выглядит как «ошибок не было»
    # (найдено при первом развёртывании 2026-09-17, до отправки хоть одного события).
    #
    # Безопасность здесь обеспечивает сам DSN: ключ проекта передаётся в заголовке X-Sentry-Auth
    # или в query, GlitchTip проверяет его и отвергает чужие. Это эндпоинт записи, а не чтения —
    # прочитать через него ничего нельзя, только прислать событие в конкретный проект.
    #
    # Регулярное выражение важнее префикса `location /` по правилам nginx, поэтому этот блок
    # перехватывает ingest-пути раньше. Директивы проксирования повторены намеренно: location
    # не наследует их от соседнего location.
    location ~ ^/api/[0-9]+/(store|envelope|security)/ {
        auth_basic off;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        client_max_body_size 20m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # GlitchTip is Django behind gunicorn — like the .NET API it trusts X-Forwarded-Proto to
        # know a request arrived over HTTPS (needed for it to generate correct absolute URLs and
        # mark cookies Secure); without this every link GlitchTip renders comes out as http://.
        proxy_set_header X-Forwarded-Proto $scheme;

        # GlitchTip is a session-cookie web app (unlike /api/ and /uploads/ in ezbook.conf, which
        # are stateless bearer-token JSON): HTTP/1.1 + Connection "" is needed so nginx doesn't
        # force `Connection: close` on the upstream link, which would defeat keepalive to gunicorn
        # and make every page load open a fresh backend connection.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Ingested events carry stack traces, breadcrumbs and (for the API's Sentry.Serilog sink)
        # serialized exception payloads — bigger than a typical form POST. GlitchTip's own default
        # is 20M; matching it here so nginx isn't the tighter limit and silently 413s events that
        # GlitchTip itself would have accepted.
        client_max_body_size 20m;

        # A slow client on a bad connection uploading a large event, or the UI itself waiting on a
        # slow search/aggregation query, are both legitimate — longer than nginx's 60s default so
        # neither gets cut off mid-request. Not unlimited: this is still bounded, just not tight.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # See top-of-file comment — password file created once per DEPLOY.md §12.
        auth_basic "GlitchTip";
        auth_basic_user_file /etc/nginx/errors.ezbook.htpasswd;
    }

    # Security headers — same three as ezbook.conf's server level (DEPLOY.md §6.4 / US-47): this is
    # a different vhost so nginx does not inherit them from there, they need to be declared again.
    # No CSP/X-Frame-Options here on purpose: GlitchTip is a third-party app that sets its own, and
    # this proxy has no reason to know or duplicate its content model the way ezbook.conf does for
    # the SPA it's shipping.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
