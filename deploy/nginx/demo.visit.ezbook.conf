# nginx site config for demo.visit.ezbook.ru — демо-стенд (цикл 28, проход B; ARCHITECTURE_CYCLE28.md §581.1, DEPLOY.md §25)
# Copy to /etc/nginx/sites-available/demo.visit.ezbook.conf on the VPS, symlink into sites-enabled,
# then run `certbot --nginx -d demo.visit.ezbook.ru` to add TLS (it rewrites the server block below to add
# the certificate + a port-443 server block, same convention as ezbook.conf / goods.ezbook.conf; HTTP-01, отдельный сертификат).
# Re-copying this file over the installed one drops certbot's 443 block: rerun certbot right after.
#
# Тот же сервер, та же сборка SPA (/var/www/ezbook/current — деплой и откат переключают все сайты одним symlink'ом),
# но API — отдельный контейнер api-demo на 127.0.0.1:5001 (docker-compose.demo.yml), со своей БД и своими ключами.
#
# Демо закрыто от индексации на трёх уровнях: заголовок X-Robots-Tag (везде), /robots.txt с Disallow и то, что
# страницы приложения сами не попадают в выдачу без ссылок с боя.
# Вебхуки провайдеров, отписка и MAX-бот на демо не работают (провайдеры logging/stub) — закрыты 404, чтобы
# боевые секреты из путей не ложились в лог этого хоста и чтобы боевой бот/провайдер не мог быть направлен сюда.

server {
    listen 80;
    listen [::]:80;
    server_name demo.visit.ezbook.ru;

    root /var/www/ezbook/current;
    index index.html;

    client_max_body_size 6M;   # как на ezbook.ru: чуть выше лимита API 5 МБ на изображение

    # Второй фронтенд (goods) лежит в том же релизе; на демо-хосте он не нужен (как в ezbook.conf).
    location ^~ /__goods/ { return 404; }
    location ^~ /__dom/ { return 404; }
    location ^~ /__bani/ { return 404; }

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Вебхуки/отписка/бот верификации телефона: на демо 404 (longest-prefix ^~ побеждает /api/ ниже).
    location ^~ /api/phone-verification/ { return 404; }
    location ^~ /api/notifications/provider-webhook/ { return 404; }
    location ^~ /api/notifications/unsubscribe/ { return 404; }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Само API на демо отдаёт X-Robots-Tag тоже; скрываем его, чтобы не было дубля — nginx добавляет свой (уровень server),
        # и он же попадает на 503 «Демо обновляется» и ошибки самого nginx.
        proxy_hide_header X-Robots-Tag;
    }

    # Service worker без кеша браузера — как на ezbook.ru: старый обработчик push не должен переживать деплой.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # /embed/* на демо-хосте не выделяем: виджет-iframe демо никто встраивать не должен, кадрирование запрещено везде.
    # SPA: всё на index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://smartcaptcha.yandexcloud.net; frame-src https://smartcaptcha.yandexcloud.net; connect-src 'self' https://smartcaptcha.yandexcloud.net; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Повторены с уровня server намеренно: add_header не наследуется, если в location есть свой (см. ezbook.conf).
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Для локаций без своих add_header (/uploads/ и ответы nginx).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
