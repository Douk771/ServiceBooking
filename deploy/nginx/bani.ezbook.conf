# nginx site config for bani.ezbook.ru (cycle 42, ARCHITECTURE_CYCLE42.md §42.13.1)
# Copy to /etc/nginx/sites-available/bani.ezbook.conf on the VPS, symlink into sites-enabled, then run
# `certbot --nginx -d bani.ezbook.ru` (DEPLOY.md §31). Re-copying this file over the installed one drops certbot's 443 block:
# rerun certbot right after, as for ezbook.conf and goods.ezbook.conf. NOT installed by cycle 42 (no rollout to the machine).

# bani.ezbook.ru — четвёртый фронтенд. Тот же сервер, тот же API, тот же релизный каталог: /var/www/ezbook/current/__bani.

# Токен брони — секрет доступа к брони (имя, маска телефона, реквизиты оплаты, подтверждения). Он в пути страницы /b/<token> (заказ услуги — /s/<token>), в пути API
# /api/baths/service-orders/public/<token>, /api/stays/service-orders/public/<token> и /api/stays/bookings/public/<token> и в Referer при переходе со страницы брони. Маскируем все три (урок циклов 9/14, 23).
map $request_uri $bani_safe_uri {
    ~^(?<bani_uri_prefix>/(?:api/baths/service-orders/public|api/stays/service-orders/public|api/stays/bookings/public|s|b)/)[^/?]+(?<bani_uri_rest>.*)$ "${bani_uri_prefix}MASKED${bani_uri_rest}";
    default $request_uri;
}
map $http_referer $bani_safe_referer {
    ~^(?<bani_ref_prefix>https?://[^/]+/(?:b|s)/)[^/?#]+(?<bani_ref_rest>.*)$ "${bani_ref_prefix}MASKED${bani_ref_rest}";
    default $http_referer;
}
log_format bani_masked '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $bani_safe_uri $server_protocol" '
                      '$status $body_bytes_sent "$bani_safe_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name bani.ezbook.ru;

    root /var/www/ezbook/current/__bani;
    index index.html;
    access_log /var/log/nginx/bani.access.log bani_masked;

    client_max_body_size 11M;   # подтверждение оплаты до 10 МБ (ARCHITECTURE_CYCLE37.md §42.13.1)

    # Стенд до приглашения реальных владельцев (Т42-17): не индексировать. Снять строкой при запуске.
    # add_header не наследуется — строка повторена в каждом location с add_header и на уровне server.

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вебхуки провайдеров и отписка живут на ezbook.ru (PublicBaseUrl) — на bani им делать нечего.
    # Не проксируем вовсе, чтобы секрет из их пути не лёг в bani.access.log немаскированным.
    location /api/notifications/provider-webhook/ { return 404; }
    location /api/notifications/unsubscribe/      { return 404; }
    location /api/phone-verification/max/webhook/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # bani как приложение (ARCHITECTURE_CYCLE37.md §42.13.1): service worker без кеша браузера — иначе старый
    # обработчик push переживёт деплой; манифест — с правильным типом для iOS/Android.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Хэшированные бандлы неизменны; index.html (ниже, через try_files) — no-cache, иначе Home Screen-приложение
    # на iOS держит старый index.html и не видит новую сборку (плашка «Доступна новая версия», useAppUpdate).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: /<slug>, /<slug>/<resource>, /b/<token>, /cabinet/... — всё на index.html. Виджета-iframe у bani нет → кадрирование запрещено везде.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://smartcaptcha.yandexcloud.net; frame-src https://smartcaptcha.yandexcloud.net; connect-src 'self' https://smartcaptcha.yandexcloud.net; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; frame-ancestors 'none'" always;
        # Повторены с уровня server намеренно: add_header не наследуется, если в location есть свой (см. ezbook.conf).
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
