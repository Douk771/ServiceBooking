# nginx site config for ezbook.ru
# Copy to /etc/nginx/sites-available/ezbook.conf on the VPS, symlink into sites-enabled,
# then run `certbot --nginx -d ezbook.ru -d www.ezbook.ru` to add TLS (it rewrites the
# server blocks below to add the certificate + a port-443 server block automatically).

server {
    listen 80;
    listen [::]:80;
    server_name ezbook.ru www.ezbook.ru;

    # Release layout is releases/<timestamp>/ with `current` an atomically-switched symlink to the live
    # one (T-D3, US-44, ARCHITECTURE.md §12.3, deploy/deploy-remote.sh / rollback.sh) — nginx always
    # reads through this symlink, so a deploy or rollback needs nothing here, not even a reload... but
    # `nginx -t && systemctl reload nginx` is run anyway by both scripts, cheap insurance against a
    # config drift going unnoticed.
    root /var/www/ezbook/current;
    index index.html;

    client_max_body_size 6M;   # a little above the API's 5MB image-upload limit (logo/avatar/service/client photo)

    # PUBLIC storage class only (company logos, avatars, service images) — served straight off disk by
    # the API's UseStaticFiles. Client-note photos are a separate, PRIVATE class that is never mounted
    # under wwwroot and never reachable here; they go through /api/client-notes/photos/{id} below, which
    # checks the caller's company membership before streaming anything (ARCHITECTURE.md §3).
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger is no longer exposed in Production at all (the API now serves it only when
    # ASPNETCORE_ENVIRONMENT=Development — see Program.cs, US-10), so there is nothing at
    # /swagger/ to proxy to; a request there falls through to the SPA below and 404s from
    # React Router instead, which is the desired behavior.

    # /embed/* — the booking-widget iframe route (SPEC US-03 p.6, ARCHITECTURE.md §16). This is the
    # ONE place in the app that is meant to be embedded in a company's own website via <iframe>, so it
    # deliberately does NOT send X-Frame-Options/CSP frame-ancestors — see the explicit denial below for
    # everything else. Same SPA fallback as location / below, just without the framing restriction.
    # The rest of US-47's security headers (HSTS, X-Content-Type-Options, Referrer-Policy) are transport-
    # /content-type-level, not framing-related — they DO apply here too, added at the server level below.
    #
    # BUG FOUND LIVE on ezbook.ru (2026-09-17): the naive `try_files $uri $uri/ /index.html;` here looked
    # correct but ISN'T — try_files's fallback path is an *internal redirect*, and nginx re-matches that
    # redirected URI against the location blocks from scratch. /index.html doesn't fall under /embed/, so
    # it re-lands in `location /` below and picks up ITS add_header (X-Frame-Options DENY + frame-ancestors
    # 'none') — i.e. framing was being denied on the exact route that exists to be framed, on every single
    # /embed/<slug> request (there is never a file on disk for those, so the fallback fires 100% of the
    # time). Fixed by sending the fallback to a *named* location instead: named locations are the one kind
    # of location nginx does NOT re-match by prefix, so /index.html served from @embed_fallback stays
    # governed by /embed/'s (lack of) add_header, not location /'s. try_files itself still checks for a
    # real file/directory under /embed/ first, so any actual static asset there keeps being served as-is.
    location /embed/ {
        try_files $uri $uri/ @embed_fallback;
    }

    location @embed_fallback {
        rewrite ^ /index.html break;
    }

    # React SPA — client-side routing fallback. Everything except /embed/* above is denied framing:
    # the rest of the app (login, dashboards, booking flow) has no legitimate reason to be shown inside
    # someone else's iframe, and allowing it would open it to clickjacking (SPEC US-03 p.6).
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options DENY always;
        # style-src/font-src include Google Fonts because frontend/index.html loads the Newsreader/Inter
        # stylesheet from fonts.googleapis.com (which in turn @imports woff2 files from fonts.gstatic.com) —
        # verified live (see DEPLOY.md §6 "Проверка после выкладки"): without these two additions the
        # stylesheet load is refused by the browser and the app silently falls back to a system font.
        # script-src/frame-src/connect-src for SmartCaptcha deliberately list ONLY smartcaptcha.yandexcloud.net:
        # verified live with a real captcha render that the widget's own resources (mc.yandex.ru, yastatic.net
        # — Metrica counter + fonts) are loaded entirely inside its own iframe (frame-src) under Yandex's own
        # CSP, never as top-level requests from this page, so they need no entry here.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://smartcaptcha.yandexcloud.net; frame-src https://smartcaptcha.yandexcloud.net; connect-src 'self' https://smartcaptcha.yandexcloud.net; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'" always;
        # REPEATED from the server level on purpose, do not "deduplicate": nginx's add_header is
        # inherited from the enclosing level ONLY if the current level declares no add_header of its
        # own. This location declares two, so without these three lines the server-level HSTS/nosniff/
        # Referrer-Policy below are silently dropped for every SPA response — i.e. for exactly the
        # pages US-47 is about. /embed/, /api/ and /uploads/ declare none and do inherit them.
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # US-47 (T-D5, ARCHITECTURE.md §12.4) — applied to every location that does NOT declare its own
    # add_header, which is /embed/, /api/ and /uploads/. `location /` declares its own framing headers
    # and therefore repeats these three inline (see above) — nginx does not merge add_header across
    # levels. None of these three are about framing, so the widget keeps working the same in an iframe.
    #   - HSTS without `preload` on this first rollout: max-age is real (180 days) but not submitted to
    #     browsers' preload lists yet — that's a one-way door (very hard to undo) worth doing as a
    #     deliberate, separate step once the domain has run HTTPS-only for a while, not by default here.
    #   - nosniff stops a browser from re-interpreting an uploaded file's declared Content-Type — relevant
    #     given four upload endpoints exist (ARCHITECTURE.md §4.12) even though FileStorage never trusts
    #     a client-declared MIME type for the decision to process a file in the first place.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
