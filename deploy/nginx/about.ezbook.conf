# nginx site config for about.ezbook.ru (cycle 44, ARCHITECTURE_CYCLE44_PRODUCTS_LANDING.md §44.9.1)
# Copy to /etc/nginx/sites-available/about.ezbook.conf on the VPS, symlink into sites-enabled, then run
# `certbot --nginx -d about.ezbook.ru` (DEPLOY.md §33). Re-copying this file over the installed one drops certbot's 443 block:
# rerun certbot right after, as for bani.ezbook.conf. NOT installed by cycle 44 (no rollout to the machine).

# about.ezbook.ru — статическая страница «Все продукты EZBOOK». Тот же сервер и релизный каталог: /var/www/ezbook/current/__about.
# Никакого API: хост от него не зависит и не открывает его второй дверью. Страница без JS — в CSP нет script-src.
# Индексируется (X-Robots-Tag нет намеренно — главное отличие от dom/bani).
# add_header не наследуется — заголовки безопасности повторены в каждом location с add_header и на уровне server.

server {
    listen 80;
    listen [::]:80;
    server_name about.ezbook.ru;

    root /var/www/ezbook/current/__about;
    index index.html;
    access_log /var/log/nginx/about.access.log;

    location /api/     { return 404; }
    location /uploads/ { return 404; }

    # Одна каноническая форма адреса. Не `location = /index.html`: директива index делает внутренний редирект
    # `/` -> `/index.html`, и такой location зациклил бы главную на саму себя. $request_uri — исходный адрес запроса.
    if ($request_uri = /index.html) {
        return 301 /;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /sitemap.xml {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Без SPA-fallback: неизвестный адрес — честный 404 (не «мягкий 404» для поисковика).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/xml text/plain;
}
