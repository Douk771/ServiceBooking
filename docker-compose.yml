services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servicebooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ServiceBooking.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      # Without this the runtime defaults to Production (the aspnet base image sets no environment),
      # and the Production fail-fast in Program.cs rejects the placeholder Jwt__Key below — the dev
      # stack would refuse to start.
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=servicebooking;Username=postgres;Password=postgres
      - Jwt__Key=CHANGE_ME_TO_A_LONG_SECRET_KEY_AT_LEAST_32_CHARS
      - Jwt__Issuer=ServiceBooking
      - Jwt__Audience=ServiceBookingClient
      - AllowedOrigins=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
