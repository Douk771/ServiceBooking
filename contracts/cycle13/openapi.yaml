openapi: 3.0.3

# ServiceBooking — машиночитаемый контракт ЦИКЛА 13
# (адрес компании: переходы в Яндекс.Карты и 2ГИС + МЯГКАЯ верификация адреса за рубильником).
#
# ИСТОЧНИК ИСТИНЫ ПО ФОРМЕ интерфейса. Смысл и правила — API_CONTRACT_CYCLE13.md (§230–§241),
# решения — ARCHITECTURE_CYCLE13.md (§200–§219). При расхождении прав ЭТОТ файл.
#
# Как пользоваться:
#   frontend  npx @stoplight/prism mock contracts/cycle13/openapi.yaml --port 4013
#             npm run types:api:cycle13   (openapi-typescript -> src/types/api-cycle13.generated.ts)
#   QA        schemathesis run contracts/cycle13/openapi.yaml --base-url http://localhost:5000 --checks all
#             ⚠️ ТОЛЬКО при AddressVerification:Provider = logging — иначе прогон уйдёт в платный геокодер.
#
# Здесь описаны ТОЛЬКО эндпоинты, которые цикл 13 добавляет или меняет. Остальной API —
# в API_DOCUMENTATION.md и контрактах циклов 3, 4, 6, 7, 8, 9, 10, 11.
#
# ДВЕ ИЗ ТРЁХ ЗАДАЧ ЦИКЛА СЕРВЕРНОЙ ЧАСТИ НЕ ИМЕЮТ ВОВСЕ:
#   * галерея-карусель вместо мозаики и логотип поверх фотографий — чистый фронтенд;
#     фотографии уже приходят вместе с компанией (API_CONTRACT_CYCLE10.md §129);
#   * переходы в Яндекс.Карты и 2ГИС собираются в браузере из address + cityName, которые в
#     CompanyDto уже есть. Публичная страница компании не получает ни одного нового запроса.
#
# У ИЗМЕНЁННЫХ ответов, где цикл добавляет поля к большому существующему DTO (CompanyDto), схема
# описывает ТОЛЬКО новые поля и стоит с additionalProperties: true — это честно отражает «форма
# прежняя плюс вот это» и не заводит вторую, расходящуюся копию всего DTO.

info:
  title: ServiceBooking API — цикл 13 (адрес на картах и мягкая верификация адреса)
  version: "9.0.0"
  description: |
    Конвенции проекта, действующие без изменений:
      * camelCase в JSON, enum — строками, DateTime — ISO-8601 UTC;
      * тела ошибок 400/402/409/410/429 — ГОЛАЯ СТРОКА (text/plain), 401/403 — ПУСТОЕ тело,
        404 — пустое тело там, где существование объекта не подтверждается;
      * ProblemDetails не используется (кроме автовалидации [ApiController]);
      * все новые поля ДОБАВОЧНЫЕ — цикл не удаляет и не переименовывает ничего;
      * null у вычисляемого поля = «сервер не считал это для данного вызывающего», а не «нет значения».

    ГЛАВНЫЕ ПРАВИЛА ЦИКЛА, которые схема закрепляет формой:

    1. ВЕРИФИКАЦИЯ МЯГКАЯ. Ни «не нашли», ни «нашли неточно», ни «нашли в другом городе», ни
       «геокодер недоступен» не дают ответа 4xx/5xx. Адрес сохраняется в том виде, как его ввёл
       человек, статус — «не подтверждён», исход приходит полем `outcome` в теле 200.
       PUT /companies/{id}/address НИКОГДА не отвечает 502/504.

    2. ПОДТВЕРЖДЕНИЕ СТАВИТ ТОЛЬКО СЕРВЕР, по результату своего собственного обращения к карте.
       Поля «считай этот адрес подтверждённым» в контракте нет и не будет: иначе через прямой вызов
       API в базу попал бы «подтверждённый» адрес, которого никто не проверял.

    3. РУБИЛЬНИК ЧЕСТНЫЙ. При AddressVerification:Provider = logging (штатное состояние прода после
       этого цикла) POST /companies/address/lookup отвечает 404 — функции нет, а не «есть и молчит».
       Интерфейс не должен доводить до этого ответа: признак — company.addressVerification.available.
       PUT /companies/{id}/address при этом РАБОТАЕТ: сохранение адреса не зависит от внешнего сервиса.

    4. ГЕОКОДЕР ДЁРГАЕТСЯ ТОЛЬКО ПО ЯВНОМУ ДЕЙСТВИЮ владельца или суперадмина. Просмотр публичной
       страницы, заход в каталог и сохранение настроек компании (PUT /api/companies/{id}) внешних
       вызовов не делают ни одного.

servers:
  - url: /api
    description: Тот же base URL, что у axios-инстанса фронта (frontend/src/api/client.ts).

tags:
  - name: company-address
    description: Адрес компании — поиск по карте и сохранение со статусом проверки (US-134…US-138, US-140)
  - name: company-address-readonly
    description: Добавочные поля адреса в существующих ответах о компании (US-139)

security:
  - bearerAuth: []

paths:

  # ─────────────────────── Поиск вариантов адреса (ничего не пишет) ───────────────────────

  /companies/address/lookup:
    post:
      tags: [company-address]
      operationId: lookupCompanyAddress
      summary: Найти варианты адреса по карте (до пяти), ничего не сохраняя
      description: |
        НОВЫЙ в цикле 13.

        Один эндпоинт обслуживает и СОЗДАНИЕ компании (её ещё нет — `companyId` не передаётся), и
        настройки существующей (`companyId` передаётся). Так адаптер геокодера вызывается из одного
        места, а не из двух.

        Доступ: любой авторизованный пользователь. Если передан `companyId`, вызывающий обязан
        управлять этой компанией (владелец или SuperAdmin) — иначе 404 с ПУСТЫМ телом: существование
        чужой компании не подтверждается, и код ответа не должен работать оракулом.

        Наружу, в чужой сервис, уходит ТОЛЬКО адрес и город. Ни телефона, ни почты, ни имени
        владельца, ни идентификаторов клиентов в запросе к карте нет.

        Лимит — именованная политика `address-verify` (30/час на пользователя, десятая в проекте).

        404 ЕСТЬ ШТАТНЫЙ ОТВЕТ при выключенном рубильнике (§233 контракта).
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressLookupRequestDto' }
      responses:
        "200":
          description: |
            Результат поиска. 200 приходит и когда ничего не нашли (`outcome: Empty`), и когда
            внешний сервис недоступен (`outcome: Unavailable`) — это не ошибки нашей операции.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressLookupResultDto' }
        "400":
          description: |
            Голая строка, по-русски. Возможные тексты:
              «Укажите адрес» (пустой/пробельный `address`);
              «Слишком длинный адрес — максимум 300 символов»;
              «Город не найден» (`cityId` не существует или неактивен).
          content:
            text/plain:
              schema: { type: string }
        "401":
          $ref: '#/components/responses/UnauthorizedEmpty'
        "404":
          description: |
            Пустое тело. ДВЕ причины, намеренно неразличимые для вызывающего:
              1) рубильник проверки выключен (AddressVerification:Provider = logging) — функции нет;
              2) `companyId` не существует либо вызывающий этой компанией не управляет.
        "415":
          description: Тело запроса не `application/json`. Тело ответа пустое (стандартное поведение ASP.NET).
        "429":
          $ref: '#/components/responses/TooManyRequests'

  # ─────────────────────── Сохранение адреса (единственный писатель статуса) ───────────────────────

  /companies/{id}/address:
    put:
      tags: [company-address]
      operationId: updateCompanyAddress
      summary: Сохранить адрес компании и, по просьбе, подтвердить его по карте
      description: |
        НОВЫЙ в цикле 13. ЕДИНСТВЕННЫЙ эндпоинт, который пишет поля проверки адреса.

        Доступ: владелец компании или SuperAdmin (правило `CanManageCompany` — то же, что у
        PUT /api/companies/{id}; второй копии правила «кто может править компанию» не существует).

        РАБОТАЕТ ВСЕГДА, в том числе при выключенном рубильнике: сохранение адреса не имеет права
        зависеть от внешнего сервиса. При выключенном рубильнике `verify: true` игнорируется,
        внешних вызовов не делается, исход — `Disabled`.

        `verify: true` НЕ означает «я уже проверил, поверь»: сервер сам обращается к карте, сам
        сравнивает присланную строку с найденными вариантами и ставит подтверждение только если
        увидел совпадение. Иначе адрес сохраняется как есть со статусом «не подтверждён».

        Пустая строка в `address` СТИРАЕТ адрес (Address = null) и очищает проверку. Это отличается
        от PUT /api/companies/{id}, где отсутствующее/`null` поле значит «не трогать».

        НИКОГДА не отвечает 502/504: недоступность карты — это `verification.outcome = Unavailable`
        в теле 200.

        Лимит — та же политика `address-verify`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCompanyAddressDto' }
      responses:
        "200":
          description: |
            Адрес сохранён. Возвращается полный CompanyDto (чтобы кеш интерфейса обновлялся одним
            ответом, как это уже делает PUT /api/companies/{id}) и блок результата проверки.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyAddressUpdateResultDto' }
        "400":
          description: 'Голая строка: «Слишком длинный адрес — максимум 300 символов»'
          content:
            text/plain:
              schema: { type: string }
        "401":
          $ref: '#/components/responses/UnauthorizedEmpty'
        "403":
          $ref: '#/components/responses/ForbiddenEmpty'
        "404":
          $ref: '#/components/responses/NotFoundEmpty'
        "415":
          description: Тело запроса не `application/json`. Тело ответа пустое.
        "429":
          $ref: '#/components/responses/TooManyRequests'

  # ─────────────────────── Добавочные поля в существующих ответах ───────────────────────

  /companies/{slug}:
    get:
      tags: [company-address-readonly]
      operationId: getCompanyBySlug
      summary: Публичная карточка компании (добавлены addressVerification и addressPoint)
      description: |
        ИЗМЕНЁН в цикле 13 — ДОБАВОЧНЫЕ поля `addressVerification` и `addressPoint`. Остальная форма
        CompanyDto (включая `photos`, `coverPhotoUrl`, `coverThumbnailUrl` цикла 10) не меняется и
        здесь не переописывается.

        ПРИ АНОНИМНОМ ВЫЗОВЕ `addressVerification` ВСЕГДА null: статус «не подтверждён» на публичной
        витрине — ущерб салону, а не польза клиенту, поэтому клиенту он не отдаётся ни в каком виде.

        `addressPoint` — единственное место во всём API, где он заполняется, и то лишь при трёх
        одновременных условиях: включено хранение результатов геокодирования
        (AddressVerification:StoreResults), адрес подтверждён, точность `House`. В штатном состоянии
        прода после этого цикла он ВСЕГДА null, и это нормально: переходы в карты тогда ведут на
        поиск по тексту «город, адрес».

        Публичная страница компании НЕ получает ни одного нового запроса: и фотографии (цикл 10), и
        всё, из чего строятся переходы в карты, приезжают вместе с компанией.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Компания
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyDtoAddressDelta' }
        "404":
          $ref: '#/components/responses/NotFoundEmpty'

  /companies/{id}:
    put:
      tags: [company-address-readonly]
      operationId: updateCompany
      summary: Настройки компании (форма НЕ менялась; у правки address появилось следствие)
      description: |
        НЕ ИЗМЕНЁН в цикле 13 по форме запроса. Описан здесь ради ОДНОГО следствия, которое обязаны
        знать и бэкенд, и фронт:

        статус подтверждения вычисляется сервером из сравнения текущего текста адреса с тем, который
        подтверждали, поэтому ЛЮБАЯ правка `address` через этот эндпоинт (кабинет владельца,
        суперадмин, прямой вызов API, скрипт) автоматически делает адрес «не подтверждённым».
        Геокодер при этом НЕ вызывается — ни одного внешнего запроса на сохранении настроек.

        В ответе — тот же CompanyDto, у которого теперь есть `addressVerification` (вызывающий
        управляет компанией, значит поле заполнено).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                UpdateCompanyDto — форма прежняя, здесь не переописывается (см. API_DOCUMENTATION.md
                и контракты циклов 4/6). `address: null`/отсутствует = «не трогать».
              properties:
                address:
                  type: string
                  nullable: true
                  maxLength: 300
      responses:
        "200":
          description: Компания после сохранения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyDtoAddressDelta' }
        "400":
          $ref: '#/components/responses/BadRequestText'
        "401":
          $ref: '#/components/responses/UnauthorizedEmpty'
        "403":
          $ref: '#/components/responses/ForbiddenEmpty'
        "404":
          $ref: '#/components/responses/NotFoundEmpty'

  /companies/public:
    get:
      tags: [company-address-readonly]
      operationId: getPublicCompanies
      summary: Публичный каталог (поля адреса присутствуют, но всегда null)
      description: |
        ИЗМЕНЁН в цикле 13 только формально: `addressVerification` и `addressPoint` есть в форме, но
        на этом эндпоинте ВСЕГДА null. Каталог анонимен (статус никому не отдаётся), а метка на
        карте в каталоге не нужна — карточка каталога сама является ссылкой и переходов в карты не
        получает (решение §3 SPEC).

        Параметры `cityId`/`search`/`page`/`pageSize` и правила поиска (подстрока по названию ИЛИ
        адресу, в SQL) НЕ меняются. Нормализация адреса при подтверждении меняет строку, по которой
        ищут, но поиск подстрокой сохраняет попадание по названию улицы — это закреплено
        функциональным тестом (ARCHITECTURE_CYCLE13.md §214, R7).
      security: []
      parameters:
        - name: cityId
          in: query
          required: false
          schema: { type: integer }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Страница каталога
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CompanyDtoAddressDelta' }
        "400":
          $ref: '#/components/responses/BadRequestText'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequestText:
      description: Голая строка с причиной (text/plain), не JSON-объект
      content:
        text/plain:
          schema: { type: string }
    NotFoundEmpty:
      description: Пустое тело. Используется и когда объекта нет, и когда вызывающему не положено знать о его существовании.
    UnauthorizedEmpty:
      description: Пустое тело
    ForbiddenEmpty:
      description: Пустое тело
    TooManyRequests:
      description: |
        Превышен лимит именованной политики `address-verify` (30/час на пользователя).
        Тело — голая строка, как у остальных политик проекта.
      content:
        text/plain:
          schema: { type: string }

  schemas:

    # ── Общие значения ─────────────────────────────────────────────────────

    GeoPointDto:
      type: object
      required: [latitude, longitude]
      description: |
        Точка на карте. ВНИМАНИЕ для сборки ссылок: и Яндекс.Карты, и 2ГИС принимают координаты в
        порядке «долгота,широта» — обратный порядок молча открывает другое место на планете.
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90, example: 53.347 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180, example: 83.778 }

    AddressPrecision:
      type: string
      description: |
        С какой точностью карта нашла адрес. Список закрыт, значения append-only.
          House    — строение (единственная точность, при которой подтверждение полноценно);
          Street   — только улица;
          Locality — только населённый пункт или район;
          Other    — карта не смогла определить уровень.
      enum: [House, Street, Locality, Other]

    AddressVerificationStatus:
      type: string
      description: |
        Вычисляется СЕРВЕРОМ: Verified только если текущий текст адреса совпадает (после нормализации)
        с тем, который подтверждали. Отдельной колонки под статус в БД нет намеренно — второй источник
        правды разъехался бы с текстом адреса при правке через любой второй вход.
      enum: [Verified, Unverified]

    AddressLookupOutcome:
      type: string
      description: |
        Что произошло при обращении к карте.
          Ok          — варианты найдены;
          Empty       — карта ответила, но ничего не нашла;
          Unavailable — таймаут (≤5 с), сетевая ошибка, не-200 или нечитаемый ответ;
          Disabled    — рубильник проверки выключен. Приходит ТОЛЬКО у PUT /companies/{id}/address;
                        у POST /companies/address/lookup это состояние выражено кодом 404.
      enum: [Ok, Empty, Unavailable, Disabled]

    AddressWarningCode:
      type: string
      description: |
        Код предупреждения — для логики интерфейса и для тестов. Готовый русский ТЕКСТ собирает
        сервер (поле `message`): вторая версия формулировок на фронте разошлась бы с серверной
        (конвенция NotificationTexts / BookingEventTexts). Список закрыт, значения append-only.
          NotFound          — карта не нашла ничего (тон текста: адреса может не быть в карте, не «вы ошиблись»);
          PrecisionStreet   — найдена только улица;
          PrecisionLocality — найден только населённый пункт/район;
          PrecisionOther    — уровень не определён;
          CityMismatch      — населённый пункт найденного адреса не совпал с городом компании; текст ОБЯЗАН
                              упомянуть, что от города зависят часовой пояс и город в каталоге. Город компании
                              автоматически НЕ МЕНЯЕТСЯ никогда;
          Unavailable       — внешний сервис недоступен; текст обязан сказать, что сохранение не заблокировано.
      enum: [NotFound, PrecisionStreet, PrecisionLocality, PrecisionOther, CityMismatch, Unavailable]

    AddressWarningDto:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/AddressWarningCode' }
        message:
          type: string
          maxLength: 400
          description: |
            Готовая русская строка для показа рядом с полем адреса. Интерфейс обязан связать её с
            полем программно (aria-describedby), а не только цветом; это текст рядом с полем, не
            модальное окно и не alert.

    # ── Запрос и ответ поиска ──────────────────────────────────────────────

    AddressLookupRequestDto:
      type: object
      required: [address]
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 300
          description: Что ввёл человек. Пусто/пробелы → 400 «Укажите адрес».
          example: Ленина 5
        cityId:
          type: integer
          nullable: true
          description: |
            Подсказка города из справочника. Не передан, но передан `companyId` → берётся город
            компании. Не передан ни один → поиск без города, и предупреждение CityMismatch в этом
            случае не выдаётся. Несуществующий/неактивный → 400 «Город не найден».
        companyId:
          type: string
          format: uuid
          nullable: true
          description: |
            Для какой компании проверяем. Нужен для города и для прав. Не передаётся при СОЗДАНИИ
            компании (её ещё нет) — это штатный случай, а не ошибка.

    AddressCandidateDto:
      type: object
      required: [formattedAddress, precision, cityName, point, warnings]
      properties:
        formattedAddress:
          type: string
          maxLength: 300
          description: |
            Полное написание, в котором адрес знает карта. Именно ЭТУ строку интерфейс подставляет в
            поле и отправляет в PUT /companies/{id}/address.
          example: Россия, Алтайский край, Барнаул, проспект Ленина, 5
        precision: { $ref: '#/components/schemas/AddressPrecision' }
        cityName:
          type: string
          nullable: true
          description: Населённый пункт из ответа карты. По нему считается предупреждение CityMismatch.
        point:
          allOf:
            - $ref: '#/components/schemas/GeoPointDto'
          nullable: true
          description: |
            Координаты варианта. null, если хранить результаты геокодирования не разрешено
            (AddressVerification:StoreResults = false) — ШТАТНОЕ состояние: продукт обязан работать
            и без права хранить результат.
        warnings:
          type: array
          description: Что не так именно с этим вариантом (точность, другой город). Пустой массив — всё в порядке.
          items: { $ref: '#/components/schemas/AddressWarningDto' }

    AddressLookupResultDto:
      type: object
      required: [outcome, queriedAddress, candidates, warnings, attribution]
      properties:
        outcome:
          allOf:
            - $ref: '#/components/schemas/AddressLookupOutcome'
          description: На этом эндпоинте возможны только Ok, Empty, Unavailable (Disabled выражен кодом 404).
        queriedAddress:
          type: string
          description: Что именно сервер отправил в карту («город, адрес») — чтобы владелец видел, по чему искали.
          example: Барнаул, Ленина 5
        candidates:
          type: array
          maxItems: 5
          description: |
            Найденные варианты в том порядке, в котором их вернула карта (по убыванию релевантности).
            Пустой массив при outcome Empty и Unavailable.
          items: { $ref: '#/components/schemas/AddressCandidateDto' }
        warnings:
          type: array
          description: Что не так с запросом в целом (NotFound при Empty, Unavailable при недоступности).
          items: { $ref: '#/components/schemas/AddressWarningDto' }
        attribution:
          type: string
          description: |
            Обязательная по лицензии подпись правообладателя карты. Показывается интерфейсом ровно
            так, как её прислал сервер; своей формулировки фронт не придумывает.
          example: © Яндекс

    # ── Запрос и ответ сохранения ──────────────────────────────────────────

    UpdateCompanyAddressDto:
      type: object
      required: [address]
      properties:
        address:
          type: string
          maxLength: 300
          description: |
            Текст адреса. ПУСТАЯ СТРОКА = стереть адрес (Address → null) и очистить проверку.
            Это сознательно отличается от PUT /api/companies/{id}, где отсутствующее/null поле
            значит «не трогать».
          example: Россия, Алтайский край, Барнаул, проспект Ленина, 5
        verify:
          type: boolean
          default: false
          description: |
            Просьба «сервер, найди эту строку в карте и подтверди её сам». НЕ утверждение «я уже
            проверил»: подтверждение ставится только по результату собственного обращения сервера.
            При выключенном рубильнике игнорируется (внешних вызовов не делается, outcome = Disabled).

    CompanyAddressVerificationDto:
      type: object
      required: [available, status, verifiedAt, precision]
      description: |
        Состояние проверки адреса. Заполняется ТОЛЬКО там, где вызывающий управляет компанией
        (владелец, SuperAdmin) — по тому же признаку, по которому уже считаются employeeCount и
        accountSeats*. На анонимных и клиентских путях поле-родитель равно null.
      properties:
        available:
          type: boolean
          description: |
            Проверка доступна: рубильник включён И вызывающий управляет компанией. ЕДИНСТВЕННЫЙ
            признак, по которому интерфейсу разрешено рисовать кнопку «Проверить адрес».
            false → кнопки нет ВОВСЕ (а не есть и не работает).
        status: { $ref: '#/components/schemas/AddressVerificationStatus' }
        verifiedAt:
          type: string
          format: date-time
          nullable: true
          description: Когда подтвердили (UTC). null при Unverified.
        precision:
          allOf:
            - $ref: '#/components/schemas/AddressPrecision'
          nullable: true
          description: С какой точностью подтвердили. null при Unverified.

    CompanyAddressVerificationResultDto:
      type: object
      required: [outcome, status, verifiedAt, precision, warnings, attribution]
      description: Что случилось в этом конкретном сохранении адреса.
      properties:
        outcome: { $ref: '#/components/schemas/AddressLookupOutcome' }
        status: { $ref: '#/components/schemas/AddressVerificationStatus' }
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        precision:
          allOf:
            - $ref: '#/components/schemas/AddressPrecision'
          nullable: true
        warnings:
          type: array
          items: { $ref: '#/components/schemas/AddressWarningDto' }
        attribution:
          type: string
          description: Подпись правообладателя; пустая строка, когда к карте не обращались (Disabled).

    CompanyAddressUpdateResultDto:
      type: object
      required: [company, verification]
      properties:
        company:
          allOf:
            - $ref: '#/components/schemas/CompanyDtoAddressDelta'
          description: |
            ПОЛНЫЙ CompanyDto после сохранения — чтобы кеш интерфейса обновлялся одним ответом, как
            это уже делает PUT /api/companies/{id}.
        verification: { $ref: '#/components/schemas/CompanyAddressVerificationResultDto' }

    # ── Дельта к существующему CompanyDto ──────────────────────────────────

    CompanyDtoAddressDelta:
      type: object
      additionalProperties: true
      required: [id, slug, address, cityName, addressVerification, addressPoint]
      description: |
        ДЕЛЬТА к существующему CompanyDto: цикл 13 добавляет два поля. Остальные (включая photos,
        coverPhotoUrl, coverThumbnailUrl цикла 10) приходят как раньше и здесь намеренно не
        переописываются (additionalProperties: true) — вторая копия большого DTO разошлась бы с
        оригиналом.

        `address` и `cityName` перечислены не потому, что цикл их менял (он не менял), а потому что
        именно из них фронт собирает переходы в Яндекс.Карты и 2ГИС: сервер в сборке ссылок не
        участвует вовсе, и это единственные входные данные, кроме необязательного addressPoint.
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        address:
          type: string
          nullable: true
          maxLength: 300
          description: |
            НЕ ИЗМЕНЁН циклом. Пусто/null → интерфейс не рисует ни адреса, ни переходов в карты
            (пустых кнопок не появляется).
        cityName:
          type: string
          nullable: true
          description: |
            НЕ ИЗМЕНЁН циклом. Обязательная часть запроса к карте: «ул. Ленина, 5» без города
            открывает Ленина в другом регионе. Порядок в запросе — «город, адрес».
        addressVerification:
          allOf:
            - $ref: '#/components/schemas/CompanyAddressVerificationDto'
          nullable: true
          description: |
            null = «сервер не считал это для данного вызывающего» (аноним, клиент, каталог), а НЕ
            «не подтверждён». Фронт обязан трактовать отсутствие поля как «проверка недоступна,
            адрес не подтверждён» — тем же приёмом, каким photos: null читается как пустая галерея.
        addressPoint:
          allOf:
            - $ref: '#/components/schemas/GeoPointDto'
          nullable: true
          description: |
            Заполняется ТОЛЬКО на GET /api/companies/{slug} и только при трёх одновременных условиях:
            включено хранение результатов геокодирования, адрес подтверждён, точность House.
            В штатном состоянии прода после этого цикла — ВСЕГДА null, и переходы в карты ведут на
            поиск по тексту. Наличие точки не является «ярлыком проверенности»: статус клиенту не
            показывается ни в каком виде.
