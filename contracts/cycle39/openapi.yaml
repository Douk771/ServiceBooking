      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - { $ref: '#/components/parameters/ServiceId' }
        - { $ref: '#/components/parameters/DateQuery' }
        - name: bookingId
          in: query
          required: false
          description: Сеанс к этой брони — в пределах проживания.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Старты.
