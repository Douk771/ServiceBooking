        - { $ref: '#/components/parameters/StayCheckInQuery' }
        - { $ref: '#/components/parameters/StayCheckOutQuery' }
      responses:
        '200':
          description: Календарь дат.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAvailabilityDto' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/public/services/{serviceId}/starts:
    get:
      tags: [stays-services-public]
      operationId: staysServiceStarts
      summary: Доступные старты на дату и максимум часов для каждого.
      security: []
      parameters:
        - { $ref: '#/components/parameters/ServiceId' }
        - { $ref: '#/components/parameters/DateQuery' }
        - { $ref: '#/components/parameters/StayHouseQuery' }
        - { $ref: '#/components/parameters/StayCheckInQuery' }
        - { $ref: '#/components/parameters/StayCheckOutQuery' }
      responses:
        '200':
          description: Старты.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceStartsDto' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/public/services/{serviceId}/quote:
    post:
      tags: [stays-services-public]
      operationId: staysServiceQuote
      summary: Расчёт сеанса (всегда 200, ничего не резервирует).
      security: []
      parameters:
        - { $ref: '#/components/parameters/ServiceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicServiceQuoteInput' }
      responses:
        '200':
          description: Расчёт.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceQuoteDto' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/public/services/{serviceId}/orders:
    post:
      tags: [stays-services-public]
      operationId: staysCreateServiceOrder
      summary: Заказ услуги без проживания.
      security: []
      parameters:
        - { $ref: '#/components/parameters/ServiceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceOrderInput' }
      responses:
        '200':
          description: Повтор с тем же ключом — существующий заказ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateServiceOrderResponse' }
        '201':
          description: Заказ создан (Held при предоплате, иначе Confirmed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateServiceOrderResponse' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ServiceRefusal' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ═════════════ заказ по ссылке ═════════════
  /api/stays/service-orders/public/{token}:
    get:
      tags: [stays-service-orders-public]
      operationId: staysServiceOrderPublic
      summary: Страница отдельного сеанса.
      security: []
      parameters:
        - { $ref: '#/components/parameters/OrderToken' }
      responses:
        '200':
          description: Заказ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicServiceOrderDto' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/service-orders/public/{token}/payment-proofs:
