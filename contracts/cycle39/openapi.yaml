openapi: 3.0.3

# ServiceBooking — машиночитаемый контракт ЦИКЛА 39
# («Дома», цикл 2: услуги-слоты — баня, чан, фурако; редактируемое напоминание накануне заезда; хвосты цикла 37).
#
# ИСТОЧНИК ИСТИНЫ ПО ФОРМЕ интерфейса новых маршрутов и изменённых маршрутов цикла 37. Смысл, порядок проверок и тексты —
# API_CONTRACT_CYCLE39.md (§39.20–§39.39), решения — ARCHITECTURE_CYCLE39.md (§39.0–§39.19), требования —
# SPEC_CYCLE39_STAYS_SLOTS_ICAL.md, правовые решения — LEGAL_REVIEW_CYCLE39.md + §39.0a архитектуры.
#
# Рядом:
#   contracts/cycle39/service-vectors.json — эталон: бизнес-день, окна, цены часов, деньги, старты, пересечение, возврат, формат, напоминание
#   contracts/cycle39/dom-routes.json      — маршруты dom цикла 39 и резерв слов (надмножество cycle37)
#
# Как пользоваться:
#   frontend  npx @stoplight/prism mock contracts/cycle39/openapi.yaml --port 4039
#             npm run types:api:cycle39   (openapi-typescript -> src/types/api-cycle39.generated.ts)
#   QA        schemathesis run contracts/cycle39/openapi.yaml --base-url http://localhost:5000 --checks all
#   CI        npx @redocly/cli lint ../contracts/cycle39/openapi.yaml                                   (профиль по умолчанию)
#             npx @redocly/cli lint --config ../contracts/redocly.yaml ../contracts/cycle39/openapi.yaml
#             npm run contracts:json (cycle39 -> openapi.json для ServiceBooking.Tests/Infrastructure/OpenApiContract.cs)
#
# Изменённые маршруты цикла 37 (тег shared-changed) описаны частичными DTO: только новые поля, additionalProperties: true.
# Закрытые входы цикла 37, получившие поле services, повторены здесь целиком (additionalProperties: false).
# Время суток услуги — МИНУТЫ от 00:00 даты бизнес-дня (360…1800 при границе 06:00), см. ARCHITECTURE_CYCLE39.md §39.3.

info:
  title: ServiceBooking API — цикл 39 (Дома, цикл 2 — услуги-слоты и напоминание)
  version: "39.1.0"
  license:
    name: Proprietary
    url: https://ezbook.ru/terms
  description: "Конвенции цикла 37 без изменений: camelCase; enum — строками; DateTime — ISO-8601 UTC; DateOnly — YYYY-MM-DD; деньги — целые рубли (суффикс Rub); тела осознанных 400/402/429 — голая строка text/plain; 401/403/404 — пустое тело; все 409 маршрутов /api/stays/* — JSON с code и message. Время суток услуги — минуты от 00:00 даты бизнес-дня (startMinute, endMinute; 360…1800). Тексты для людей (подписи времени, статусы, суммы возврата, тексты напоминания) собирает сервер: гостю — календарными датами, персоналу — на бизнес-дне старта."

servers:
  - url: https://dom.ezbook.ru
    description: production

security:
  - bearerAuth: []

tags:
  - name: shared-changed
    description: Изменённые маршруты цикла 37 — частичные DTO с новыми полями.
  - name: stays-services-public
    description: Услуги анонимно — страница услуги, календарь дат, старты, расчёт, заказ без проживания.
  - name: stays-service-orders-public
    description: Отдельный сеанс глазами гостя по ссылке /s/<token>.
  - name: stays-booking-services
    description: Услуги к проживанию со страницы брони /b/<token>.
  - name: stays-services
    description: Кабинет — услуги, фото, настройки, цены, позиции, публикация.
  - name: stays-service-schedule
    description: Кабинет — недельный шаблон и ручные даты расписания услуги.
  - name: stays-service-sessions
    description: Кабинет — День услуг, сеансы, проверка оплаты, отмена, добавление к брони, ручной заказ.
  - name: stays-reminder
    description: Кабинет — время и шаблон напоминания накануне заезда, предпросмотр, история.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      description: Id компании «Дома». Салон, магазин или чужая компания — 404.
      schema: { type: string, format: uuid }
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProofId:
      name: proofId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HouseId:
      name: houseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Slug:
      name: slug
      in: path
      required: true
      description: Адрес компании (dom-routes.json slugPattern).
      schema: { type: string, minLength: 1, maxLength: 100 }
    HouseSlug:
      name: houseSlug
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    ServiceSlug:
      name: serviceSlug
      in: path
      required: true
      description: Адрес услуги (dom-routes.json serviceSlugPattern).
      schema: { type: string, minLength: 1, maxLength: 100 }
    BookingToken:
      name: token
      in: path
      required: true
      description: Токен брони дома из ссылки /b/<token>.
      schema: { type: string, minLength: 1, maxLength: 100 }
    OrderToken:
      name: token
      in: path
      required: true
      description: Токен заказа услуги из ссылки /s/<token>.
      schema: { type: string, minLength: 1, maxLength: 100 }
    OverrideDate:
      name: date
      in: path
      required: true
      description: Бизнес-день ручной даты.
      schema: { type: string, format: date }
    DateQuery:
      name: date
      in: query
      required: true
      description: Бизнес-день (дата выбора времени).
      schema: { type: string, format: date }
    StayHouseQuery:
      name: houseId
      in: query
      required: false
      description: Режим «к проживанию» из формы брони дома (US-39-10) — вместе с checkIn и checkOut.
      schema: { type: string, format: uuid }
    StayCheckInQuery:
      name: checkIn
      in: query
      required: false
      schema: { type: string, format: date }
    StayCheckOutQuery:
      name: checkOut
      in: query
      required: false
      schema: { type: string, format: date }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    PlainTextError:
      description: Осознанный отказ — голая строка по-русски.
      content:
        text/plain:
          schema: { type: string }
    TooManyRequests:
      description: Лимит частоты или лимит номера — строка по-русски.
      content:
        text/plain:
          schema: { type: string }
    Unauthorized:
      description: Нет или недействителен токен. Тело пустое.
    Forbidden:
      description: Член компании без нужного права. Тело пустое.
    NotFound:
      description: Не существует или не ваше — неотличимо. Тело пустое.
    NoContent:
      description: Успех без тела.
    ServiceRefusal:
      description: Отказ расчёта, заказа или добавления сеанса.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceRefusalDto' }
    ServiceGuestConflict:
      description: Действие гостя над заказом не применено.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceOrderGuestConflictDto' }
    BookingGuestConflict:
      description: Действие гостя над сеансом брони не применено.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StayBookingGuestConflictDto' }
    ServiceStaffConflict:
      description: Действие персонала над сеансом не применено.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceStaffConflictDto' }
    StaysServiceConflict:
      description: Конфликт в кабинете услуг или напоминания.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StaysServiceConflictDto' }
    StayRefusal:
      description: Отказ расчёта или создания брони дома (цикл 37, дополнен кодами услуг).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StayRefusalDto' }
    StaysConflict:
      description: Конфликт настроек компании (цикл 37, дополнен кодом).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StaysConflictDto' }
    PaymentProofFile:
      description: "Файл подтверждения оплаты. Заголовки: Cache-Control: private, no-store; X-Content-Type-Options: nosniff; Content-Security-Policy: sandbox; PDF — Content-Disposition: attachment."
      content:
        application/pdf:
          schema: { type: string, format: binary }
        image/jpeg:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }

  schemas:
    # ───────────── перечисления ─────────────
    StayBookingStatus:
      type: string
      enum: [Held, AwaitingPaymentCheck, Confirmed, ExpiredUnpaid, PaymentRejected, CancelledByGuest, CancelledByOwner]
    StayDisplayStatus:
      type: string
      description: Completed — вычисляемый вид Confirmed после окончания сеанса.
      enum: [Held, AwaitingPaymentCheck, Confirmed, Completed, ExpiredUnpaid, PaymentRejected, CancelledByGuest, CancelledByOwner]
    StayServiceSessionState:
      type: string
      enum: [Active, CancelledByGuest, CancelledByOwner, ReleasedWithBooking, ReleasedWithOrder]
    StayServiceCancellationPolicy:
      type: string
      description: ЮР39-1 — два законных шаблона. Шаблона Standard из SPEC нет ни в каком виде.
      enum: [NoDeductions, PreparationCosts]
    StayServiceRequestBasis:
      type: string
      description: Основание сеанса, добавленного персоналом по просьбе гостя (ЮР39-6).
      enum: [Phone, InPerson, Messenger]
    ServiceRefundKind:
      type: string
      description: CostsOnlyUpTo — остаток к возврату 0; сумма «не меньше 0» не показывается (refundAtLeastRub = null).
      enum: [NothingPaid, Full, PartialAtLeast, CostsOnlyUpTo]
    ServiceRefusalCode:
      type: string
      enum: [ServiceOrdersDisabled, ServiceNotAvailableForStays, NotAcceptingBookings, DateInPast, BeyondHorizon, HoursOutOfRange, OutsideStay, TooEarly, StartUnavailable, NoPriceForHours, SlotTaken, ItemUnavailable, ItemQuantityExceeded, BookingNotActive, TooManySessions, PriceChanged]
    NotAcceptingReason:
      type: string
      enum: [CompanyBlocked, NoPlan, OverHouseLimit, NoPaymentDetails, NoProviderInfo, HouseNotPublished]
    ServiceGuestConflictCode:
      type: string
      enum: [HoldExpired, ProofLimitReached, ProofNotAllowed, CancelNotAllowed]
    StaffConflictCode:
      type: string
      enum: [VersionMismatch, InvalidTransition]
    StaysServiceConflictCode:
      type: string
      enum: [SlugInvalid, SlugTaken, ServiceHasSessions, ServiceArchived, ServiceNoPrice, ServiceNoWindows, ServiceLimitReached, PhotoLimitReached, ItemLimitReached, PriceRuleOverlap, PriceRuleLimitReached, ReminderConfirmationRequired]
    StartsReason:
      type: string
      enum: [DateInPast, BeyondHorizon, Closed, NoStarts]
    DateSource:
      type: string
      enum: [Template, Override, Closed]
    ServiceDayBarKind:
      type: string
      enum: [Session, Buffer, CarryOverBuffer]
    ServiceSessionKind:
      type: string
      enum: [InBooking, Standalone]
    ServiceChargeKind:
      type: string
      enum: [Service, Item]
    ServiceGuestAction:
      type: string
      enum: [AttachProof, Cancel]
    ServiceStaffAction:
      type: string
      enum: [ConfirmPayment, RejectPayment, Cancel]
    StaysPermission:
      type: string
      description: Цикл 39 дописал ManageServices, EditServiceContent, ManageServiceDates.
      enum: [ManageCompany, ManageHouses, EditHouseContent, ViewBookings, ManageBookings, ManageBlocks, ViewSchedule, ViewCabinet, ManageServices, EditServiceContent, ManageServiceDates]
    StayChargeKind:
      type: string
      description: Строки суммы брони; цикл 39 дописал ServiceSlot и ServiceItem (PrepayEligible всегда false).
      enum: [Nights, ExtraBeds, Dogs, Cot, ManualTotal, ServiceSlot, ServiceItem]
    StayRefusalCode:
      type: string
      description: Коды цикла 37 плюс ServiceSlotUnavailable и ServiceSelectionInvalid (бронь дома с сеансами).
      enum: [InvalidDates, CheckInInPast, SameDayNotAllowed, BeyondHorizon, MaxNightsExceeded, DatesUnavailable, MinNightsNotMet, TooManyGuests, DogsNotAllowed, CotNotAvailable, NoPriceForNights, NotAcceptingBookings, PriceChanged, ServiceSlotUnavailable, ServiceSelectionInvalid]
    StaysConflictCode:
      type: string
      description: Коды цикла 37 плюс ProviderRequiredForServiceOrders.
      enum: [SlugInvalid, SlugReserved, SlugTaken, NoPrice, ObjectKindRequired, RegistryNumberRequired, AttestationRequired, HouseArchived, HouseHasBookings, PhotoLimitReached, PricePeriodOverlap, BlockConflictsWithBooking, BlockOverlapsBlock, MessengerUnavailable, ProviderRequiredForServiceOrders]
    StayGuestBookingConflictCode:
      type: string
      enum: [CancelNotAllowed]
    StayCancellationPolicy:
      type: string
      enum: [Standard, Flexible, NoDeductions]
    ReminderDropReason:
      type: string
      enum: [ForbiddenPlaceholder, EmptyValue, Digits, Link, Email, Phone, CodeWord]
    ReminderWarning:
      type: string
      enum: [CancellationTermsInText, Passport, CardNumber, PassportNumber]
    ReminderErrorCode:
      type: string
      enum: [TooLong, UnknownPlaceholder, ForbiddenWords]
    StayProviderStatus:
      type: string
      enum: [Organization, IndividualEntrepreneur, SelfEmployed, Individual]
    TimeOfDay:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      example: "18:00"
    MinuteOfBusinessDay:
      type: integer
      description: Минута от 00:00 даты бизнес-дня; 360 = 06:00, 1560 = 02:00 следующих суток, 1800 = 06:00 следующих суток.
      minimum: 0
      maximum: 2880

    # ───────────── общее ─────────────
    WindowInput:
      type: object
      additionalProperties: false
      required: [startMinute, endMinute]
      properties:
        startMinute: { $ref: '#/components/schemas/MinuteOfBusinessDay' }
        endMinute: { $ref: '#/components/schemas/MinuteOfBusinessDay' }
    WindowDto:
      type: object
      required: [startMinute, endMinute, label]
      properties:
        startMinute: { $ref: '#/components/schemas/MinuteOfBusinessDay' }
        endMinute: { $ref: '#/components/schemas/MinuteOfBusinessDay' }
        label:
          type: string
          description: 18:00 – 02:00 (след. дня)
    ServiceTimeDto:
      type: object
      required: [businessDate, startMinute, endMinute, hours, startUtc, endUtc, label]
      properties:
        businessDate: { type: string, format: date }
        startMinute: { $ref: '#/components/schemas/MinuteOfBusinessDay' }
        endMinute: { $ref: '#/components/schemas/MinuteOfBusinessDay' }
        hours: { type: integer, minimum: 1, maximum: 12 }
        startUtc: { type: string, format: date-time }
        endUtc: { type: string, format: date-time }
        label:
          type: string
          description: Гостю — календарными датами (пт 15 янв, 22:00 — сб 16 янв, 01:00); персоналу — Пт, 15 янв · 22:00 – 01:00 (сб).
    HourPriceDto:
      type: object
      required: [startMinute, label, priceRub]
      properties:
        startMinute: { $ref: '#/components/schemas/MinuteOfBusinessDay' }
        label:
          type: string
          description: Начало часа с календарной датой гостю (сб 16 янв, 00:00).
        priceRub: { type: integer }
    ItemSelectionInput:
      type: object
      additionalProperties: false
      required: [itemId, quantity]
      properties:
        itemId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 0, maximum: 50 }
    ServiceSelectionInput:
      type: object
      additionalProperties: false
      required: [businessDate, startMinute, hours, items]
      properties:
        businessDate: { type: string, format: date }
        startMinute: { $ref: '#/components/schemas/MinuteOfBusinessDay' }
        hours: { type: integer, minimum: 1, maximum: 12 }
        items:
          type: array
          maxItems: 20
          description: Позиции с количеством; отсутствие позиции = 0 (по умолчанию ничего не выбрано, 69-ФЗ).
          items: { $ref: '#/components/schemas/ItemSelectionInput' }
    ServiceItemPublicDto:
      type: object
      required: [id, name, priceRub, maxPerSession]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        priceRub: { type: integer }
        maxPerSession: { type: integer }
    SessionItemDto:
      type: object
      required: [name, unitPriceRub, quantity, amountRub]
      properties:
        name: { type: string }
        unitPriceRub: { type: integer }
        quantity: { type: integer }
        amountRub: { type: integer }
    ServiceChargeLineDto:
      type: object
      required: [kind, label, quantity, unitPriceRub, amountRub]
      properties:
        kind: { $ref: '#/components/schemas/ServiceChargeKind' }
        label: { type: string }
        quantity: { type: integer }
        unitPriceRub: { type: integer }
        amountRub: { type: integer }
    ServiceRefundViewDto:
      type: object
      required: [kind, maxDeductionRub, text]
      properties:
        kind: { $ref: '#/components/schemas/ServiceRefundKind' }
        refundAtLeastRub:
          type: integer
          nullable: true
          description: null при CostsOnlyUpTo — «не меньше 0 ₽» не показывается никогда (Т39-02).
        maxDeductionRub: { type: integer }
        text:
          type: string
          description: Готовый текст сервера.
    ProviderPublicDto:
      type: object
      nullable: true
      required: [status, statusLabel, inn]
      properties:
        status: { $ref: '#/components/schemas/StayProviderStatus' }
        statusLabel: { type: string }
        name: { type: string, nullable: true }
        inn: { type: string }
        ogrn: { type: string, nullable: true }
        claimsAddress: { type: string, nullable: true }
    ProviderFullDto:
      type: object
      nullable: true
      required: [status, statusLabel, name, inn, claimsAddress]
      properties:
        status: { $ref: '#/components/schemas/StayProviderStatus' }
        statusLabel: { type: string }
        name: { type: string }
        inn: { type: string }
        ogrn: { type: string, nullable: true }
        claimsAddress: { type: string }
    ProblemDto:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ServiceRefusalCode' }
        message: { type: string }
    PaymentInstructionsDto:
      type: object
      nullable: true
      required: [amountRub]
      properties:
        details: { type: string, nullable: true }
        purpose: { type: string, nullable: true }
        amountRub: { type: integer }
    PaymentProofDto:
      type: object
      required: [id, contentType, sizeBytes, uploadedAtUtc, purged]
      properties:
        id: { type: string, format: uuid }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer }
        uploadedAtUtc: { type: string, format: date-time }
        purged: { type: boolean }
    ProofRulesDto:
      type: object
      required: [canAttach, maxCount, maxBytes, acceptedTypes]
      properties:
        canAttach: { type: boolean }
        maxCount: { type: integer }
        maxBytes: { type: integer }
        acceptedTypes:
          type: array
          items: { type: string }
    PaymentConfirmedDto:
      type: object
      nullable: true
      required: [atUtc, byName]
      properties:
        atUtc: { type: string, format: date-time }
        byName: { type: string }
    GateDto:
      type: object
      required: [accepting]
      properties:
        accepting: { type: boolean }
        reasonCode:
          allOf: [ { $ref: '#/components/schemas/NotAcceptingReason' } ]
          type: string
          nullable: true
        reasonText: { type: string, nullable: true }
    JournalEventDto:
      type: object
      required: [occurredAtUtc, kind, text, actorText]
      properties:
        occurredAtUtc: { type: string, format: date-time }
        kind: { type: string }
        text: { type: string }
        actorText: { type: string }
        reason: { type: string, nullable: true }
    PushSubscriptionInput:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, maxLength: 2048 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
        deviceLabel: { type: string, nullable: true, maxLength: 100 }
    PushSubscriptionRemoveInput:
      type: object
      additionalProperties: false
      required: [endpoint]
      properties:
        endpoint: { type: string, maxLength: 2048 }
    ExpectedVersionInput:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
    ExpectedVersionReasonInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer }
        reason: { type: string, minLength: 1, maxLength: 300 }
    IdsOrderInput:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
    EmptyInput:
      type: object
      additionalProperties: false

    # ───────────── ошибки 409 ─────────────
    ServiceRefusalDto:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ServiceRefusalCode' }
        message: { type: string }
        reasonCode:
          allOf: [ { $ref: '#/components/schemas/NotAcceptingReason' } ]
          type: string
          nullable: true
        quote:
          allOf: [ { $ref: '#/components/schemas/ServiceQuoteDto' } ]
          type: object
          nullable: true
          description: Только у PriceChanged.
    ServiceOrderGuestConflictDto:
      type: object
      required: [code, message, order]
      properties:
        code: { $ref: '#/components/schemas/ServiceGuestConflictCode' }
        message: { type: string }
        order: { $ref: '#/components/schemas/PublicServiceOrderDto' }
    StayBookingGuestConflictDto:
      type: object
      required: [code, message, booking]
      properties:
