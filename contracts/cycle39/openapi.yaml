      tags: [stays-service-orders-public]
      operationId: staysServiceOrderAttachProof
      summary: Приложить подтверждение оплаты.
      security: []
      parameters:
        - { $ref: '#/components/parameters/OrderToken' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
