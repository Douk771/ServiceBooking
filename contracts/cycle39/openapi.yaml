        '404': { $ref: '#/components/responses/NotFound' }

  /api/stays/companies/{companyId}/service-sessions:
    get:
      tags: [stays-service-sessions]
      operationId: staysServiceSessions
      summary: Сеансы — по умолчанию отдельные, ожидающие проверки оплаты.
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - name: status
          in: query
          required: false
          description: Статус заказа (повторяемый); по умолчанию AwaitingPaymentCheck.
          schema:
            type: array
            items: { $ref: '#/components/schemas/StayBookingStatus' }
        - name: serviceId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Страница сеансов.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffServiceSessionPage' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [stays-service-sessions]
      operationId: staysCreateManualServiceOrder
      summary: Ручной отдельный сеанс (P1) — сразу Confirmed.
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualServiceOrderInput' }
      responses:
        '201':
          description: Сеанс создан.
          content:
