      required: [name, quantity]
      properties:
        name: { type: string }
        quantity: { type: integer }
    ScheduleSessionDto:
      type: object
      description: Без телефона, сумм, файлов и статуса оплаты (только paymentUnconfirmed). comment = null, если скрыт от горничной.
      additionalProperties: false
      required: [sessionId, serviceName, timeLabel, preparedUntilLabel, items, paymentUnconfirmed]
      properties:
        sessionId: { type: string, format: uuid }
        serviceName: { type: string }
        timeLabel:
          type: string
          description: 22:00 – 01:00 (сб)
        preparedUntilLabel:
          type: string
          description: 01:30 (сб)
        houseName:
          type: string
          nullable: true
          description: null — без проживания.
        guestName: { type: string, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/ScheduleItemDto' }
        comment: { type: string, nullable: true }
        paymentUnconfirmed: { type: boolean }
    ScheduleDayServicesPart:
      type: object
      additionalProperties: true
      required: [date, sessions]
      properties:
        date: { type: string, format: date }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/ScheduleSessionDto' }
    StaysScheduleServicesPart:
      type: object
      description: StaysScheduleDto цикла 37; в каждый день добавлен sessions[] (на бизнес-дне старта).
      additionalProperties: true
      required: [days]
      properties:
        days:
          type: array
          items: { $ref: '#/components/schemas/ScheduleDayServicesPart' }
    StaysSettingsDto:
      type: object
      description: StaysSettingsDto цикла 37 + acceptServiceOrdersWithoutStay (в PUT null или отсутствие — не менять).
      additionalProperties: false
      required: [checkInTime, checkOutTime, minNights, maxNights, horizonDays, allowGapFill, allowSameDayCheckIn, holdMinutes, prepayPercent, cancellationPolicy, dogFeeRub, cotFeeRub, checkInInfoSendTime, checkInInfoSendFullText, arrivalReminderEnabled, housekeeperSeesGuestComment, showInCatalog]
      properties:
        checkInTime: { $ref: '#/components/schemas/TimeOfDay' }
        checkOutTime: { $ref: '#/components/schemas/TimeOfDay' }
        minNights: { type: integer, minimum: 1, maximum: 30 }
        maxNights: { type: integer, minimum: 1, maximum: 90 }
        horizonDays: { type: integer, minimum: 30, maximum: 730 }
        allowGapFill: { type: boolean }
        allowSameDayCheckIn: { type: boolean }
        holdMinutes: { type: integer, minimum: 10, maximum: 180 }
        prepayPercent: { type: integer, minimum: 0, maximum: 100 }
        cancellationPolicy: { $ref: '#/components/schemas/StayCancellationPolicy' }
        dogFeeRub: { type: integer, minimum: 0, maximum: 100000 }
        cotFeeRub: { type: integer, minimum: 0, maximum: 100000 }
        checkInInfoSendTime: { $ref: '#/components/schemas/TimeOfDay' }
        checkInInfoText: { type: string, nullable: true, maxLength: 2000 }
        checkInInfoSendFullText: { type: boolean }
        arrivalReminderEnabled: { type: boolean }
        housekeeperSeesGuestComment: { type: boolean }
        showInCatalog: { type: boolean }
        acceptServiceOrdersWithoutStay: { type: boolean, nullable: true }
    StaysCompanyManageServicesPart:
      type: object
      description: StaysCompanyManageDto цикла 37; settings дополнен acceptServiceOrdersWithoutStay, myPermissions — новыми правами.
      additionalProperties: true
      required: [myPermissions, gate]
      properties:
        myPermissions:
          type: array
          items: { $ref: '#/components/schemas/StaysPermission' }
        settings:
          allOf: [ { $ref: '#/components/schemas/StaysSettingsDto' } ]
          type: object
          nullable: true
        gate: { $ref: '#/components/schemas/GateDto' }
        awaitingPaymentCount: { type: integer, nullable: true }

paths:
  # ═════════════ изменённые маршруты цикла 37 ═════════════
  /api/stays/public/companies/{slug}:
    get:
      tags: [shared-changed]
      operationId: staysPublicCompanyCycle39
      summary: Страница компании — добавлен блок услуг.
      security: []
      parameters:
        - { $ref: '#/components/parameters/Slug' }
        - { $ref: '#/components/parameters/StayCheckInQuery' }
        - { $ref: '#/components/parameters/StayCheckOutQuery' }
      responses:
        '200':
          description: Компания.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicStaysCompanyServicesPart' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/public/companies/{slug}/houses/{houseSlug}:
    get:
      tags: [shared-changed]
      operationId: staysPublicHouseCycle39
      summary: Страница дома — добавлены услуги к проживанию.
      security: []
      parameters:
        - { $ref: '#/components/parameters/Slug' }
        - { $ref: '#/components/parameters/HouseSlug' }
      responses:
        '200':
          description: Дом.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicHouseServicesPart' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/public/houses/{houseId}/quote:
    post:
      tags: [shared-changed]
      operationId: staysQuoteCycle39
      summary: Расчёт брони дома — можно передать до трёх сеансов услуг.
      security: []
      parameters:
        - { $ref: '#/components/parameters/HouseId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StayQuoteInput' }
      responses:
        '200':
          description: Расчёт (всегда 200, ничего не резервирует).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StayQuoteServicesPart' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/public/houses/{houseId}/bookings:
    post:
      tags: [shared-changed]
      operationId: staysCreateBookingCycle39
      summary: Создание брони дома — вместе с сеансами услуг одной операцией.
      security: []
      parameters:
        - { $ref: '#/components/parameters/HouseId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStayBookingInput' }
      responses:
        '200':
          description: Повтор с тем же ключом — существующая бронь.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateStayBookingServicesResponse' }
        '201':
          description: Бронь и её сеансы созданы.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateStayBookingServicesResponse' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StayRefusal' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/bookings/public/{token}:
    get:
      tags: [shared-changed]
      operationId: stayBookingPublicCycle39
      summary: Страница брони — сеансы, блок услуг, снимок напоминания.
      security: []
      parameters:
        - { $ref: '#/components/parameters/BookingToken' }
      responses:
        '200':
          description: Бронь.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicStayBookingServicesPart' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/companies/{companyId}:
    get:
      tags: [shared-changed]
      operationId: staysCompanyCycle39
      summary: Карточка компании в кабинете — новые права и настройка заказов без проживания.
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
      responses:
        '200':
          description: Компания.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaysCompanyManageServicesPart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/stays/companies/{companyId}/settings:
    put:
      tags: [shared-changed]
      operationId: staysUpdateSettingsCycle39
      summary: Настройки компании — добавлена настройка «Принимать заказы услуг без проживания».
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaysSettingsDto' }
      responses:
        '200':
          description: Компания.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaysCompanyManageServicesPart' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaysConflict' }

  /api/stays/companies/{companyId}/board:
    get:
      tags: [shared-changed]
      operationId: staysBoardCycle39
      summary: Шахматка — добавлена группа «Услуги».
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 7, maximum: 62, default: 30 }
        - name: sinceRevision
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Шахматка (или changed false).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaysBoardServicesPart' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/companies/{companyId}/schedule:
    get:
      tags: [shared-changed]
      operationId: staysScheduleCycle39
      summary: График — добавлены сеансы услуг.
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 15, default: 15 }
      responses:
        '200':
          description: График.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaysScheduleServicesPart' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/stays/companies/{companyId}/bookings/{bookingId}:
    get:
      tags: [shared-changed]
      operationId: staysBookingCardCycle39
      summary: Карточка брони — сеансы и действие AddSession.
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - { $ref: '#/components/parameters/BookingId' }
      responses:
        '200':
          description: Карточка.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffStayBookingCardServicesPart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ═════════════ услуги анонимно ═════════════
  /api/stays/public/companies/{slug}/services/{serviceSlug}:
    get:
      tags: [stays-services-public]
      operationId: staysPublicService
      summary: Страница услуги.
      security: []
      parameters:
        - { $ref: '#/components/parameters/Slug' }
        - { $ref: '#/components/parameters/ServiceSlug' }
      responses:
        '200':
          description: Услуга.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicServiceDto' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/public/services/{serviceId}/availability:
