        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PlainTextError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/service-orders/public/{token}/push-subscription/remove:
    post:
      tags: [stays-service-orders-public]
      operationId: staysServiceOrderPushUnsubscribe
      summary: Отключить push заказа (идемпотентно).
      security: []
      parameters:
        - { $ref: '#/components/parameters/OrderToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionRemoveInput' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ═════════════ услуги к проживанию по ссылке брони ═════════════
  /api/stays/bookings/public/{token}/services:
    get:
      tags: [stays-booking-services]
      operationId: stayBookingServices
      summary: Услуги, которые можно добавить к брони, и даты со временем внутри проживания.
      security: []
      parameters:
        - { $ref: '#/components/parameters/BookingToken' }
      responses:
        '200':
          description: Услуги.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingServicesDto' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/bookings/public/{token}/services/{serviceId}/starts:
    get:
      tags: [stays-booking-services]
      operationId: stayBookingServiceStarts
      summary: Старты услуги на дату в пределах проживания.
      security: []
      parameters:
        - { $ref: '#/components/parameters/BookingToken' }
        - { $ref: '#/components/parameters/ServiceId' }
        - { $ref: '#/components/parameters/DateQuery' }
      responses:
        '200':
          description: Старты.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceStartsDto' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/bookings/public/{token}/services/{serviceId}/quote:
    post:
      tags: [stays-booking-services]
      operationId: stayBookingServiceQuote
      summary: Расчёт сеанса к брони (оплата на месте).
      security: []
      parameters:
        - { $ref: '#/components/parameters/BookingToken' }
        - { $ref: '#/components/parameters/ServiceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceSelectionInput' }
      responses:
        '200':
          description: Расчёт.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceQuoteDto' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/stays/bookings/public/{token}/sessions:
    post:
      tags: [stays-booking-services]
      operationId: stayBookingAddSession
      summary: Добавить сеанс к брони.
      security: []
      parameters:
        - { $ref: '#/components/parameters/BookingToken' }
      requestBody:
        required: true
