      security: [ { bearerAuth: [] } ]
      parameters:
        - name: sinceRevision
          in: query
          required: false
          description: 'revision из прошлого ответа. Совпал с текущим и businessDate тот же → changed false, массивы null.'
          schema: { type: integer, format: int64 }
        - name: businessDate
          in: query
          required: false
          description: 'businessDate из прошлого ответа — смена суток магазина считается изменением.'
          schema: { type: string, format: date }
      responses:
        '200':
