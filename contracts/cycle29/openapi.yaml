openapi: 3.0.3

# ServiceBooking — машиночитаемый контракт ЦИКЛА 29 («Доделки цикла 26», ezbook.ru + goods.ezbook.ru).
#
# ИСТОЧНИК ИСТИНЫ ПО ФОРМЕ интерфейса. Смысл, порядок проверок и тексты — API_CONTRACT_CYCLE29.md
# (§29.20–§29.29), решения — ARCHITECTURE_CYCLE29.md (§29.0–§29.18), требования — SPEC.md цикла 29.
# Нумерация § у цикла 29 — с префиксом цикла (A29-5): со сквозными номерами других циклов не пересекается.
# При расхождении по ФОРМЕ прав ЭТОТ файл.
#
#   frontend  npx @stoplight/prism mock contracts/cycle29/openapi.yaml --port 4029
#             npm run types:api:cycle29      (openapi-typescript -> src/types/api-cycle29.generated.ts)
#   backend   npm run contracts:json          (redocly bundle -> contracts/cycle29/openapi.json; его читает
#                                              функциональный тест контракта, ARCHITECTURE_CYCLE29.md §29.7)
#   QA        schemathesis run contracts/cycle29/openapi.yaml --base-url http://localhost:5000 --checks all
#   CI        npx @redocly/cli lint --config ../contracts/redocly.yaml ../contracts/cycle29/openapi.yaml
#
# Новых маршрутов цикл НЕ добавляет (Cycle22RouteTable.golden.txt не меняется). Здесь описаны существующие
# маршруты, у которых меняется форма или поведение:
#   * GET  /api/goods/catalog            — GoodsCatalogShopDto: + logoUrl (описан ЦЕЛИКОМ, additionalProperties: false);
#   * POST /api/companies/{id}/photos    — битое имя поля формы → 400 text/plain вместо 500 (форма прежняя, цикл 26);
#   * POST /api/companies/{id}/logo      — то же (форма прежняя; ответ описан подмножеством CompanyDto).
# Правило 400 на битое имя поля ОБЩЕЕ для всех маршрутов (API_CONTRACT_CYCLE29.md §29.23); здесь оно закреплено
# на двух маршрутах загрузки, которыми пользуются оба фронта. Схемы каталога скопированы из cycle25 БЕЗ изменений
# (в том числе списки required), кроме добавленного logoUrl и additionalProperties: false у двух DTO каталога.
# Внешних $ref проект не использует.

info:
  title: ServiceBooking API — цикл 29 (доделки единой карточки компании)
  version: "29.1.0"
  license:
    name: Proprietary
  description: |
    Конвенции проекта без изменений: camelCase; enum — строкой; DateTime — ISO-8601 UTC; 400/402/429 — голая
    строка по-русски (text/plain); 401/403 — пустое тело; 404 — пустое тело, не оракул. Текст, который видит
    человек, собирает сервер.

    ГЛАВНЫЕ ПРАВИЛА ЦИКЛА, ЗАКРЕПЛЁННЫЕ ФОРМОЙ:
      1. Карточка каталога goods несёт logoUrl — то же значение, что Company.LogoUrl и StorefrontDto.logoUrl;
         null, если логотипа нет. Поле всегда присутствует в ответе (required + nullable).
      2. Неразбираемое имя поля формы (multipart/form-data или x-www-form-urlencoded) → 400 text/plain с фиксированным текстом, а не 500. Проверка идёт ПОСЛЕ аутентификации
         (аноним — 401), лимита частоты (429) и правового гейта (451), но ДО поиска компании и проверки прав:
         400 не зависит от {id} и потому не является оракулом существования.

servers:
  - url: http://localhost:5000
    description: dev (dotnet run)
  - url: http://localhost:4029
    description: prism mock по этой схеме

tags:
  - name: catalog
    description: Каталог магазинов на главной goods.ezbook.ru (анонимно).
  - name: company-photos
    description: Галерея фото компании — салона и магазина.
  - name: company-profile
    description: Профиль компании — логотип.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CompanyId:
      name: id
      in: path
      required: true
      description: Id компании (салона или магазина).
      schema: { type: string, format: uuid }

  responses:
    PlainTextError:
      description: Осознанный отказ — голая строка по-русски.
      content:
        text/plain:
          schema: { type: string }
    UploadBadRequest:
      description: |
        Осознанный отказ — голая строка по-русски. Кроме прежних текстов ImageUploadService и лимита галереи,
        с цикла 29 сюда входит отказ на неразбираемое имя поля формы (API_CONTRACT_CYCLE29.md §29.23):
        «Не удалось прочитать данные формы. Проверьте имена полей запроса.»
      content:
        text/plain:
          schema:
            type: string
            example: Не удалось прочитать данные формы. Проверьте имена полей запроса.
    Unauthorized:
      description: Нет или недействителен токен. Тело пустое.
    Forbidden:
      description: Нет прав. Тело пустое.
    NotFound:
      description: Не найдено. Тело пустое.
    PayloadTooLarge:
      description: Тело больше RequestSizeLimit (5 МБ). Тело пустое.
    LegalGate:
      description: Требуется принять новую редакцию правовых документов (глобальный LegalConsentFilter, как раньше).
      content:
        text/plain:
          schema: { type: string }
        application/json:
          schema:
            type: object
            additionalProperties: true
    TooManyRequests:
      description: Превышен лимит частоты — голая строка по-русски.
      content:
        text/plain:
          schema: { type: string }

  schemas:
    # ─────────────────────────────── каталог (cycle25 + logoUrl) ───────────────────────────────
    CatalogAcceptance:
      type: string
      description: 'AcceptingNow — «Принимает заказы»; PreorderOnly — «Можно заказать заранее»; NotAccepting — «Временно не принимает заказы».'
      enum: [AcceptingNow, PreorderOnly, NotAccepting]
    ShopOpenStateDto:
      type: object
      required: [isOpen, text]
      properties:
        isOpen: { type: boolean }
        text: { type: string, example: 'Открыто до 21:00' }
        opensAtUtc: { type: string, format: date-time, nullable: true }
        closesAtUtc: { type: string, format: date-time, nullable: true }
    CatalogCityDto:
      type: object
      required: [id, name, region, label]
      properties:
        id: { type: integer }
        name: { type: string }
        region: { type: string }
        label: { type: string, example: 'Пермь, Пермский край' }
    GoodsCatalogShopDto:
      type: object
      additionalProperties: false
      description: GoodsCatalogShopDto цикла 25 + logoUrl (цикл 29, API_CONTRACT_CYCLE29.md §29.22).
      required: [slug, path, name, cityName, openState, acceptance, acceptanceText, logoUrl]
      properties:
        slug: { type: string }
        path: { type: string, example: '/shaurma-lenina', description: 'Относительная ссылка на страницу магазина.' }
        name: { type: string }
        address: { type: string, nullable: true, description: 'Как в профиле, без города. «Город, адрес» собирает фронт (publicAddress).' }
        cityName: { type: string }
        openState: { $ref: '#/components/schemas/ShopOpenStateDto' }
        acceptance: { $ref: '#/components/schemas/CatalogAcceptance' }
        acceptanceText: { type: string, example: 'Принимает заказы' }
        logoUrl:
          type: string
          nullable: true
          description: |
            Цикл 29. Company.LogoUrl магазина — относительный путь публичного хранилища (/uploads/companies/…),
            то же значение, что StorefrontDto.logoUrl. null — логотипа нет (пустая/пробельная строка в БД → null).
            Сервер чужие адреса не проксирует и не переписывает.
          example: /uploads/companies/9f1c2b7e-0000-4000-8000-000000000001.jpg
    GoodsCatalogPageDto:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GoodsCatalogShopDto' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, example: 20 }
        totalCount: { type: integer, minimum: 0, description: 'Только видимые магазины.' }
        city:
          allOf: [ { $ref: '#/components/schemas/CatalogCityDto' } ]
          nullable: true
        emptyText: { type: string, nullable: true, example: 'В этом городе пока нет магазинов на goods' }

    # ─────────────────────────────── галерея (форма цикла 10, без изменений) ───────────────────────────────
    CompanyPhotoDto:
      type: object
      required: [id, url, thumbnailUrl, width, height, position, isCover]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, example: /uploads/companies/9f1c2b7e-0000-4000-8000-000000000001.jpg }
        thumbnailUrl: { type: string, example: /uploads/companies/3a7b1d40-0000-4000-8000-000000000002.jpg }
        width: { type: integer }
        height: { type: integer }
        position: { type: integer, minimum: 0, maximum: 9, description: '0-based порядок показа; 0 — обложка.' }
        isCover: { type: boolean, description: 'position == 0.' }

    # ─────────────────────────────── профиль (подмножество CompanyDto, как в cycle26) ───────────────────────────────
    CompanyProfileDto:
      type: object
      additionalProperties: true
      description: |
        Подмножество CompanyDto, которым отвечает POST /api/companies/{id}/logo (полная форма — API_DOCUMENTATION.md).
        Кабинеты ответ не разбирают: после успеха перечитывают свои запросы (['my-companies'] / ['shop', id]).
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        logoUrl: { type: string, nullable: true }

    MultipartImageUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: 'JPEG / PNG / WEBP, не больше 5 МБ. Имя поля — ровно "file".'

paths:
  # ─────────────────────────────── каталог goods ───────────────────────────────
  /api/goods/catalog:
    get:
      tags: [catalog]
      operationId: getGoodsCatalogCycle29
      summary: Каталог магазинов по городу (анонимно) — с логотипом магазина
      description: |
        Форма цикла 25 + GoodsCatalogShopDto.logoUrl. Список города кешируется на Orders:CatalogCacheSeconds (30 с),
        поэтому новый логотип появляется в каталоге не позже чем через 30 с. Дополнительных запросов к БД поле не
        добавляет (колонка уже читается вместе с Company).
      security: []
      parameters:
        - name: cityId
          in: query
          required: false
          description: Id города из GET /api/cities. Не передан — все города. Неизвестный — пустая страница.
          schema: { type: integer }
        - name: openNow
          in: query
          required: false
          description: true — только открытые сейчас.
          schema: { type: boolean, default: false }
        - name: search
          in: query
          required: false
          description: Поиск по названию и адресу; длиннее 100 символов — обрезается.
          schema: { type: string }
        - name: page
          in: query
          required: false
          description: Номер страницы, от 1; некорректное значение трактуется как 1.
          schema: { type: string }
      responses:
        '200':
          description: Страница видимых магазинов (20).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsCatalogPageDto' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─────────────────────────────── загрузки: битая форма → 400 ───────────────────────────────
  /api/companies/{id}/photos:
    parameters: [ { $ref: '#/components/parameters/CompanyId' } ]
    post:
      tags: [company-photos]
      operationId: uploadCompanyPhotoCycle29
      summary: Загрузить фото компании — битое имя поля формы даёт 400, а не 500
      description: |
        Форма и поведение цикла 26 без изменений. Новое в цикле 29 — место отказа на битую форму (§29.23):
        401 (нет токена) → 429 (лимит uploads) → 451 (правовой гейт) → 400 «Не удалось прочитать данные формы.
        Проверьте имена полей запроса.» (неразбираемое имя любого поля формы; одинаково для любого {id}) →
        404 → 403 → 400 (файл) → 200 (дубль) → 400 (лимит 10) → 201.
        При 400 за битую форму ничего не сохраняется: ни файла, ни строки в БД.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MultipartImageUpload' }
      responses:
        '201':
          description: Фото загружено, добавлено в конец.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyPhotoDto' }
        '200':
          description: Этот файл уже загружен — возвращается существующее фото.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyPhotoDto' }
        '400': { $ref: '#/components/responses/UploadBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '451': { $ref: '#/components/responses/LegalGate' }

  /api/companies/{id}/logo:
    parameters: [ { $ref: '#/components/parameters/CompanyId' } ]
    post:
      tags: [company-profile]
      operationId: uploadCompanyLogoCycle29
      summary: Загрузить логотип компании — битое имя поля формы даёт 400, а не 500
      description: |
        Форма и поведение прежние (цикл 13). Новое в цикле 29 — тот же порядок, что у фото (§29.23):
        401 → 429 → 451 → 400 (битая форма, одинаково для любого {id}) → 404 → 403 → 400 (файл) → 200.
        При 400 за битую форму Company.LogoUrl не меняется, файл не пишется.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MultipartImageUpload' }
      responses:
        '200':
          description: Логотип заменён; компания после сохранения (CompanyDto).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyProfileDto' }
        '400': { $ref: '#/components/responses/UploadBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '451': { $ref: '#/components/responses/LegalGate' }
