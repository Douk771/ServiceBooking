              schema:
                $ref: "#/components/schemas/PagedSubjectRequests"
        "400":
          description: Неизвестный dueState. Тело — строка.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Нет токена. Тело пустое.
        "403":
          description: Не SuperAdmin. Тело пустое.
    post:
      tags: [admin-subject-requests]
      operationId: registerSubjectRequestManually
      summary: Зарегистрировать обращение, пришедшее по почте (НОВЫЙ)
      description: |
        Та же таблица SubjectRequests. dueAt считается от receivedAt по виду обращения. channel —
        только Email или PostalMail. Сигнал GlitchTip — как у публичной формы.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSubjectRequestInput"
      responses:
        "201":
          description: Зарегистрировано.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectRequestDto"
        "400":
          description: Неверный вид/канал, дата в будущем, неверный телефон, пустой контакт/текст. Тело — строка.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Нет токена. Тело пустое.
        "403":
          description: Не SuperAdmin. Тело пустое.

  # ── Т20-08 ───────────────────────────────────────────────────────────────────────────────────────

  /api/legal/texts/{key}:
    get:
      tags: [legal]
      operationId: getLegalUiTextCycle20
      summary: Текст интерфейса из манифеста — пять новых ключей
      description: |
        Существующий публичный маршрут. Новые ключи: GuestDataGateNotice, GuestDataGateDeleteNotice,
        GuestDataGateRevokeNotice, HealthDataWrittenConsentForm, CompanyPhotoPeopleNotice. До коммита А
        они отвечают 404.
      parameters:
        - name: key
          in: path
          required: true
          description: Ключ uiText (LegalTextKey).
          schema:
            type: string
          examples:
            healthForm:
              value: HealthDataWrittenConsentForm
            gate:
              value: GuestDataGateNotice
      responses:
        "200":
          description: Текст.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalUiTextDto"
        "404":
          description: Ключа нет в манифесте. Тело пустое.
        "503":
          description: Правовые документы временно недоступны. Тело — строка.
          content:
            text/plain:
              schema:
                type: string

components:

  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      description: Идентификатор компании.
      schema:
        type: string
        format: uuid
    CompanyIdPlain:
      name: companyId
      in: path
      required: true
      description: Идентификатор компании.
      schema:
        type: string
        format: uuid
    ClientKey:
      name: clientKey
      in: path
      required: true
      description: userId зарегистрированного клиента или phone:<номер> гостя.
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      description: Идентификатор биллинг-аккаунта.
      schema:
        type: string
        format: uuid
    NoticeId:
      name: id
      in: path
      required: true
      description: Идентификатор уведомления.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы (с 1).
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Размер страницы.
      schema:
        type: integer
        minimum: 1

  schemas:

    # ── US-20-01 ──

    WrittenHealthConsentStateDto:
      type: object
      additionalProperties: false
      required: [granted, currentFormVersion]
      description: |
        Состояние отметки о бумажном согласии клиента в этой компании. При granted = false все поля,
        кроме currentFormVersion, — null.
      properties:
        granted:
          type: boolean
        recordId:
          type: string
          format: uuid
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        confirmedByName:
          type: string
          nullable: true
        formId:
          type: string
          nullable: true
          description: Номер бланка HD-XXXXXXXX; null — собственный бланк салона.
        formVersion:
          type: string
          nullable: true
          description: Версия бланка, по которой поставлена отметка.
        currentFormVersion:
          type: string
          description: Текущая версия uiText HealthDataWrittenConsentForm.

    HealthNoteDto:
      type: object
      additionalProperties: false
      required: [consentRequired, writtenConsent]
      properties:
        value:
          type: string
          nullable: true
          description: Всегда null без активной отметки.
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: string
          nullable: true
        consentRequired:
          type: boolean
          description: true — отметки нет; электронное согласие это поле больше не снимает.
        writtenConsent:
          $ref: "#/components/schemas/WrittenHealthConsentStateDto"

    UpdateHealthNoteInput:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 2000

    RequiredConsentDto:
      type: object
      additionalProperties: false
      required: [message, requiredTextKey]
      description: Существующее исключение цикла 5 из «4xx — строка».
      properties:
        message:
          type: string
        requiredTextKey:
          type: string
          description: С цикла 20 — HealthDataWrittenConsentForm.

    HealthConsentFormRuntimeValues:
      type: object
      additionalProperties: false
      required: [clientFullName, companyName, companyAddress, operatorFullName, operatorAddress, operatorInn, formId, formPrintedDate]
      description: |
        Ключи = data-legal-value файла 17. null = «в системе нет» — фронт подставляет BLANK_LINE.
        Полей паспорта НЕТ.
      properties:
        clientFullName:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
        companyAddress:
          type: string
          nullable: true
        operatorFullName:
          type: string
          nullable: true
        operatorAddress:
          type: string
          nullable: true
        operatorInn:
          type: string
          nullable: true
        formId:
          type: string
        formPrintedDate:
          type: string
          description: Дата печати для бланка, dd.MM.yyyy.

    HealthConsentFormDto:
      type: object
      additionalProperties: false
      required: [textKey, textVersion, formId, formPrintedDate, runtimeValues, operatorDetailsMissing]
      properties:
        textKey:
          type: string
          enum: [HealthDataWrittenConsentForm]
        textVersion:
          type: string
          description: Текущая версия бланка — её фронт отправляет при отметке.
        formId:
          type: string
          pattern: "^HD-[0-9A-HJKMNP-TV-Z]{8}$"
          description: Новый на каждый запрос, не хранится до отметки.
        formPrintedDate:
          type: string
          format: date
          description: Дата по Europe/Moscow.
        runtimeValues:
          $ref: "#/components/schemas/HealthConsentFormRuntimeValues"
        operatorDetailsMissing:
          type: boolean
          description: ФИО или адрес оператора на биллинг-аккаунте не заполнены.

    WrittenHealthConsentInput:
      type: object
      additionalProperties: false
      required: [textVersion, confirmed]
      properties:
        textVersion:
          type: string
          minLength: 1
          description: textVersion из GET …/health-consent-form; иная → 409.
        formId:
          type: string
          nullable: true
          pattern: "^HD-[0-9A-HJKMNP-TV-Z]{8}$"
          description: null — собственный бланк салона.
        confirmed:
          type: boolean
          description: «Подписанный оригинал у нас»; не true → 400.

    WrittenHealthConsentRevokeReason:
      type: string
      description: SubjectWithdrew — клиент отозвал письменно; MarkedByMistake — отметка ошибочна.
      enum: [SubjectWithdrew, MarkedByMistake]

    WrittenHealthConsentRevokeInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          $ref: "#/components/schemas/WrittenHealthConsentRevokeReason"

    WrittenHealthConsentRevokeResultDto:
      type: object
      additionalProperties: false
      required: [revoked, healthNotesDeleted, writtenConsent]
      properties:
        revoked:
          type: integer
          minimum: 0
        healthNotesDeleted:
          type: integer
          minimum: 0
        writtenConsent:
          $ref: "#/components/schemas/WrittenHealthConsentStateDto"

    ConsentOperatorDetailsDto:
      type: object
      additionalProperties: false
      required: [missing]
      properties:
        fullName:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        inn:
          type: string
          nullable: true
        missing:
          type: boolean
          description: fullName или address не заполнены.

    ConsentOperatorDetailsInput:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          nullable: true
          maxLength: 300
          description: Полностью, без инициалов.
        address:
          type: string
          nullable: true
          maxLength: 500
        inn:
          type: string
          nullable: true
          maxLength: 12
          description: 10 или 12 цифр (пустая строка = null).

    SubmitConsentInput:
      type: object
      additionalProperties: false
      required: [documentKey, version]
      properties:
        documentKey:
          type: string
          description: Только PdnConsent.
        version:
          type: string
        purposes:
          type: array
          nullable: true
          description: ProviderDelivery, WorkPhotos, ChannelOffer. HealthData → 400 с цикла 20.
          items:
            type: string

    RevokeConsentDocumentKey:
      type: string
      description: HealthDataWrittenConsentForm — новое значение цикла 20.
      enum: [PdnConsent, PhotoConsent, HealthDataConsent, HealthDataWrittenConsentForm]

    RevokeConsentInput:
      type: object
      additionalProperties: false
      required: [documentKey]
      properties:
        documentKey:
          $ref: "#/components/schemas/RevokeConsentDocumentKey"
        purpose:
          type: string
          nullable: true
          description: Только для PdnConsent.
        reason:
          type: string
          nullable: true
        companyId:
          type: string
          format: uuid
          nullable: true
          description: Обязателен для PhotoConsent, HealthDataConsent, HealthDataWrittenConsentForm.

    RevokeEffectsDto:
      type: object
      additionalProperties: false
      required: [photosDeleted, healthNotesDeleted, profileFieldsCleared, queuedNotificationsCancelled]
      properties:
        photosDeleted:
          type: integer
        healthNotesDeleted:
          type: integer
        profileFieldsCleared:
          type: array
          items:
            type: string
        queuedNotificationsCancelled:
          type: integer

    RevokeConsentResponseDto:
      type: object
      additionalProperties: false
      required: [revoked, effects]
      properties:
        revoked:
          type: integer
        effects:
          $ref: "#/components/schemas/RevokeEffectsDto"

    ExportGuestDataGateDto:
      type: object
      additionalProperties: false
      required: [applied]
      properties:
        applied:
          type: boolean
        reason:
          type: string
          nullable: true
        explanation:
          type: string
          nullable: true
          description: С цикла 20 — плоский текст раздела «Текст» uiText GuestDataGateNotice.
        subjectRequestPath:
          type: string
          nullable: true

    ProfileExportGatePatch:
      type: object
      additionalProperties: true
      description: Существующая выгрузка; описано только изменённое поле.
      properties:
        guestDataGate:
          $ref: "#/components/schemas/ExportGuestDataGateDto"

    # ── US-20-02 ──

    SubscriptionChangeReason:
      type: string
      description: |
        Закрытый append-only список. OperatorErrorCorrection — исправление ошибки оператора;
        TrialReissue — перевыдача пробного периода (только через regrant).
      enum: [OperatorErrorCorrection, TrialReissue]

    AssignOptionLineInput:
      type: object
      additionalProperties: false
      required: [optionId, quantity]
      properties:
        optionId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        paidUntil:
          type: string
          format: date
          nullable: true

    AssignSubscriptionInput:
      type: object
      additionalProperties: false
      required: [isActive]
      description: Существующее Billing_AssignSubscriptionInput плюс reasonCode и reasonDetails в конец.
      properties:
        planId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
        paidUntil:
          type: string
          format: date
          nullable: true
        options:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/AssignOptionLineInput"
        amount:
          type: number
          nullable: true
        comment:
          type: string
          nullable: true
        requestId:
          type: string
          format: uuid
          nullable: true
        confirmLimitOverflow:
          type: boolean
          default: false
        reasonCode:
          allOf:
            - $ref: "#/components/schemas/SubscriptionChangeReason"
          nullable: true
          description: Обязателен, когда целевой тариф isPublic = false и отличается от текущего.
        reasonDetails:
          type: string
          nullable: true
          maxLength: 1000
          description: Обязательно непустое для OperatorErrorCorrection.

    TrialRefusalDto:
      type: object
      additionalProperties: false
      required: [code, message]
      description: Существующее исключение цикла 18; здесь code = TrialPlanNotAssignableHere.
      properties:
        code:
          type: string
        message:
          type: string

    SubscriptionHistoryItemReasonPatch:
      type: object
      additionalProperties: true
      description: Существующий элемент истории плюс три поля.
      properties:
        reasonCode:
          allOf:
            - $ref: "#/components/schemas/SubscriptionChangeReason"
          nullable: true
        reasonTitle:
          type: string
          nullable: true
        reasonDetails:
          type: string
          nullable: true

    SubscriptionChangeReasonDto:
      type: object
      additionalProperties: false
      required: [code, title, detailsRequired, assignableManually]
      properties:
        code:
          $ref: "#/components/schemas/SubscriptionChangeReason"
        title:
          type: string
        detailsRequired:
          type: boolean
        assignableManually:
          type: boolean
          description: Показывать в выпадающем списке экрана назначения.

    SubscriptionChangeReasonListDto:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionChangeReasonDto"

    # ── US-20-03 ──

    PlatformNoticeKind:
      type: string
      description: Append-only. PhotoRemoved создаётся только системой.
      enum: [PriceChange, TermsChange, Suspension, NewProcessor, PhotoRemoved, Other]

    PlatformNoticeCreatableKind:
      type: string
      description: Виды, которые может опубликовать суперадмин (без PhotoRemoved).
      enum: [PriceChange, TermsChange, Suspension, NewProcessor, Other]

    NoticeAudienceType:
      type: string
      description: |
        AllOwners — держатели всех биллинг-аккаунтов; OwnersOnPlans — держатели аккаунтов на тарифах
        из planIds; BillingAccount — держатель одного аккаунта; AllClients — все пользователи, кроме
        SuperAdmin. Управляющим владельческие уведомления не показываются.
      enum: [AllOwners, OwnersOnPlans, BillingAccount, AllClients]

    NoticeAttachmentRefDto:
      type: object
      additionalProperties: false
      required: [title, sha256]
      properties:
        title:
          type: string
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"

    PlatformNoticeDto:
      type: object
      additionalProperties: false
      required: [id, kind, title, body, publishedAt, visibleUntil, acknowledged]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/PlatformNoticeKind"
        title:
          type: string
        body:
          type: string
          description: Плоский текст — снимок того, что видит адресат. Печатается дословно.
        linkUrl:
          type: string
          nullable: true
          description: Относительный путь.
        effectiveFrom:
          type: string
          format: date
          nullable: true
        publishedAt:
          type: string
          format: date-time
        visibleUntil:
          type: string
          format: date-time
        attachment:
          allOf:
            - $ref: "#/components/schemas/NoticeAttachmentRefDto"
          nullable: true
        acknowledged:
          type: boolean
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true

    PlatformNoticeListDto:
      type: object
      additionalProperties: false
      required: [acknowledgeButtonText, acknowledgeCaption, items]
      properties:
        acknowledgeButtonText:
          type: string
          description: «Я ознакомился» — из PlatformNoticeTexts, печатается дословно.
        acknowledgeCaption:
          type: string
          description: Подпись под кнопкой (Т20-02 п. 6), печатается дословно.
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformNoticeDto"

    NoticeAudienceInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/NoticeAudienceType"
        planIds:
          type: array
          nullable: true
          description: Только для OwnersOnPlans, непустой.
          items:
            type: string
            format: uuid
        billingAccountId:
          type: string
          format: uuid
          nullable: true
          description: Только для BillingAccount.

    PriceChangeParamsInput:
      type: object
      additionalProperties: false
      required: [planId, oldPricePerMonth, newPricePerMonth]
      properties:
        planId:
          type: string
          format: uuid
        oldPricePerMonth:
          type: number
          minimum: 0
        newPricePerMonth:
          type: number
          minimum: 0

    TermsChangeDocumentType:
      type: string
      description: |
        TermsOwner — только владельческие адресаты; TermsClient — только AllClients; Privacy — любые.
        Шаблон тела для TermsClient/Privacy — от legal-counsel (L3); до его утверждения → 400.
      enum: [TermsOwner, TermsClient, Privacy]

    TermsChangeParamsInput:
      type: object
      additionalProperties: false
      required: [documentType, changesSummary]
      properties:
        documentType:
          $ref: "#/components/schemas/TermsChangeDocumentType"
        changesSummary:
          type: string
          minLength: 1
          maxLength: 1000
          description: Подставляется в {перечень} шаблона.

    NoticeAttachmentInput:
      type: object
      additionalProperties: false
      required: [title, html]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        html:
          type: string
          minLength: 1
          maxLength: 1000000
          description: Снимок новой редакции (LegalKit publish --out во временный каталог).

    PlatformNoticeCreateInput:
      type: object
      additionalProperties: false
      required: [kind, audience]
      description: Матрица видов — API_CONTRACT_CYCLE20.md §434.5. Параметры чужого вида → 400.
      properties:
        kind:
          $ref: "#/components/schemas/PlatformNoticeCreatableKind"
        audience:
          $ref: "#/components/schemas/NoticeAudienceInput"
        effectiveFrom:
          type: string
          format: date
          nullable: true
          description: |
            Обязательна для PriceChange (≥ +30) и TermsChange (≥ +15 для владельческих адресатов,
            ≥ +10 для AllClients). Для NewProcessor обязательна и ≥ +15, если адресат владельческий
            (AllOwners/OwnersOnPlans/BillingAccount) — D3 п. 11.9.5; для AllClients срок не проверяется.
        title:
          type: string
          nullable: true
          maxLength: 200
          description: Только для Suspension, NewProcessor, Other.
        body:
          type: string
          nullable: true
          maxLength: 4000
          description: Только для Suspension, NewProcessor, Other.
        linkUrl:
          type: string
          nullable: true
          maxLength: 500
          pattern: "^/(?!/).*$"
        priceChange:
          allOf:
            - $ref: "#/components/schemas/PriceChangeParamsInput"
          nullable: true
        termsChange:
          allOf:
            - $ref: "#/components/schemas/TermsChangeParamsInput"
          nullable: true
        attachment:
          allOf:
            - $ref: "#/components/schemas/NoticeAttachmentInput"
          nullable: true
          description: Обязательно для TermsChange; запрещено для Suspension.

    PlatformNoticePreviewDto:
      type: object
      additionalProperties: false
      required: [title, body, visibleUntil, audienceCount]
      properties:
        title:
          type: string
        body:
          type: string
        templateVersion:
          type: string
          nullable: true
        effectiveFrom:
          type: string
          format: date
          nullable: true
        visibleUntil:
          type: string
          format: date-time
        audienceCount:
          type: integer
          minimum: 0
        attachmentSha256:
          type: string
          nullable: true

    AdminPlatformNoticeDto:
      type: object
      additionalProperties: false
      required: [id, kind, title, body, publishedAt, visibleUntil, audienceType, createdByName, audienceCount, acknowledgedCount]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/PlatformNoticeKind"
        title:
          type: string
        body:
          type: string
        linkUrl:
          type: string
          nullable: true
        effectiveFrom:
          type: string
          format: date
          nullable: true
        publishedAt:
          type: string
          format: date-time
        visibleUntil:
          type: string
          format: date-time
        attachment:
          allOf:
            - $ref: "#/components/schemas/NoticeAttachmentRefDto"
          nullable: true
        audienceType:
          $ref: "#/components/schemas/NoticeAudienceType"
        audiencePlanIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        targetBillingAccountId:
          type: string
          format: uuid
          nullable: true
        templateVersion:
          type: string
          nullable: true
        createdByName:
          type: string
          description: «Система» для PhotoRemoved.
        audienceCount:
          type: integer
          minimum: 0
          description: ТЕКУЩЕЕ число адресатов (вычисляется при чтении).
        acknowledgedCount:
          type: integer
          minimum: 0
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedByName:
          type: string
          nullable: true
        revokeReason:
          type: string
          nullable: true

    PagedAdminPlatformNotices:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPlatformNoticeDto"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        hasNext:
          type: boolean

    NoticeRevokeInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    PhotoRemovalReason:
      type: string
      description: Учитывается только у SuperAdmin — публикует уведомление PhotoRemoved.
