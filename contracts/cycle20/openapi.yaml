openapi: 3.0.3

# ServiceBooking — машиночитаемый контракт ЦИКЛА 20
# (закрытие правовых вопросов: бумажное согласие на сведения о здоровье, основание ручного назначения
#  тарифа, уведомления в кабинете с фиксацией ознакомления, предел 24 ч для отмены, сроки хранения и
#  журнал гейта, «только свои компании», ручная регистрация обращений).
#
# ИСТОЧНИК ИСТИНЫ ПО ФОРМЕ интерфейса. Смысл и правила — API_CONTRACT_CYCLE20.md (§430–§445),
# решения — ARCHITECTURE_CYCLE20.md (§400–§419), требования — SPEC_CYCLE20_LEGAL_CLOSURE.md (§12 —
# приоритетный) и LEGAL_REVIEW_CYCLE20.md §2 (Т20-01…Т20-13). При расхождении по ФОРМЕ прав ЭТОТ файл.
#
# Как пользоваться:
#   frontend  npx @stoplight/prism mock contracts/cycle20/openapi.yaml --port 4020
#             npm run types:api:cycle20   (openapi-typescript -> src/types/api-cycle20.generated.ts)
#   QA        schemathesis run contracts/cycle20/openapi.yaml --base-url http://localhost:5000 --checks all
#   CI        npx @redocly/cli lint --config ../contracts/redocly.yaml ../contracts/cycle20/openapi.yaml
#             npm run types:api:cycle20 && git diff --exit-code src/types/api-cycle20.generated.ts
#
# Здесь описаны ТОЛЬКО маршруты, которые цикл 20 добавляет или меняет. Остальной API —
# в API_DOCUMENTATION.md и контрактах циклов 3–18.
#
# У изменённых ответов, где цикл ДОБАВЛЯЕТ поля к большому существующему DTO (карточка биллинг-
# аккаунта, BookingDto, RetentionPolicyDto, CompanyTransferPreviewDto, выгрузка профиля), схема
# описывает ТОЛЬКО новые и значимые поля и стоит с additionalProperties: true — «форма прежняя плюс
# вот это», без второй расходящейся копии DTO.

info:
  title: ServiceBooking API — цикл 20 (закрытие правовых вопросов)
  version: "20.0.0"
  license:
    name: Proprietary
  description: |
    Конвенции проекта, действующие БЕЗ ИЗМЕНЕНИЙ:
      * camelCase в JSON; enum — строками (имена членов C#); DateTime — ISO-8601 UTC; DateOnly — yyyy-MM-dd;
      * тела осознанных ошибок 400/402/409/410/429 — ГОЛАЯ СТРОКА (text/plain) по-русски;
      * 401 и 403 — ПУСТОЕ тело; ProblemDetails не используется;
      * 404 без явного тела — ПУСТОЕ тело (SuppressMapClientErrors = true);
      * 451 — «требуется принять новую редакцию документов». Новые маршруты закрыты гейтом, КРОМЕ
        /api/legal/notices* — они под префиксом /api/legal/, который уже в allow-list (Т20-02 п. 4:
        приостановленный владелец и не принявший редакцию обязаны прочитать уведомление);
      * 503 со строкой — снимок правовых документов не загружен.

    Сохраняемые исключения из «4xx — строка» (новых нет):
      * RequiredConsentDto — 400 JSON у PUT …/health-note (цикл 5);
      * TrialRefusalDto — 409 JSON у PUT …/subscription для тарифа-триала (цикл 18).

    ГЛАВНЫЕ ПРАВИЛА ЦИКЛА, КОТОРЫЕ СХЕМА ЗАКРЕПЛЯЕТ ФОРМОЙ:
    1. Поле «здоровье» открывает ТОЛЬКО отметка о бумажном согласии (LG1). Электронное согласие
       поле не открывает; POST …/health-consent — 410 Gone.
    2. Паспортных данных нет ни в одном запросе и ответе. Сгенерированный бланк не хранится.
    3. Причина ручного назначения скрытого тарифа — код из закрытого списка, а не свободная строка.
    4. Опубликованное уведомление не редактируется (нет PUT), только отзывается. Ознакомление
       идемпотентно и append-only.
    5. В журнале гейта нет IP, User-Agent, телефона и счётчиков — полей нет.
    6. Текст отмены называет ПРИМЕНЁННОЕ число часов (≤ 24) — поле clientCancelMinHours.

servers:
  - url: http://localhost:5000
    description: dev (dotnet run)
  - url: http://localhost:4020
    description: prism mock по этой схеме (фронт до появления бэкенда)

tags:
  - name: health-consent
    description: Бумажное согласие на сведения о здоровье — поле, бланк, отметка, снятие (US-20-01).
  - name: billing-owner
    description: Реквизиты оператора ПДн для бланка на биллинг-аккаунте (Т20-04 п. 3).
  - name: profile
    description: Согласия клиента в профиле и выгрузка — изменения цикла 20.
  - name: admin-billing
    description: Основание ручного назначения тарифа и история подписки (US-20-02).
  - name: notices
    description: Уведомления в кабинете для адресата — список, ознакомление, вложение (US-20-03).
  - name: admin-notices
    description: Публикация, предпросмотр, отзыв уведомлений и счётчики (US-20-03).
  - name: company-photos
    description: Удаление фото компании суперадмином по обращению изображённого (Т20-07).
  - name: bookings
    description: Предел 24 ч для отмены записи клиентом (US-20-04).
  - name: admin-retention
    description: Сроки хранения и журнал срабатываний гейта гостевых данных (US-20-05).
  - name: admin-companies
    description: «Только свои компании» — перенос и смена владельца (US-20-07).
  - name: admin-subject-requests
    description: Ручная регистрация обращений субъектов, пришедших по почте (US-20-09).
  - name: legal
    description: Тексты интерфейса из правового манифеста — пять новых ключей (Т20-08).

paths:

  # ── US-20-01 ─────────────────────────────────────────────────────────────────────────────────────

  /api/companies/{companyId}/clients/{clientKey}/health-note:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/ClientKey"
    get:
      tags: [health-consent]
      operationId: getHealthNote
      summary: Заметка о здоровье клиента — открыта только при отметке о бумажном согласии
      description: |
        Без активной отметки value, updatedAt, updatedBy — ВСЕГДА null (даже если строка в БД есть),
        consentRequired = true. Электронное согласие (салонная форма HealthDataConsent,
        PdnConsent/HealthData) поле НЕ открывает. writtenConsent приходит всегда.
        SuperAdmin → 403 всегда (недоступность суперадмину не ослабляется).
      responses:
        "200":
          description: Состояние поля.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthNoteDto"
        "401":
          description: Нет токена. Тело пустое.
        "403":
          description: Не сотрудник компании или SuperAdmin. Тело пустое.
        "404":
          description: Клиент не связан с компанией или ключ неверен. Тело пустое.
        "451":
          description: Требуется принять новую редакцию документов.
    put:
      tags: [health-consent]
      operationId: putHealthNote
      summary: Записать заметку о здоровье (только при отметке)
      description: |
        [RequiresOwnerTerms] — как было. Без отметки → 400 RequiredConsentDto (JSON) с
        requiredTextKey = HealthDataWrittenConsentForm. Фронт различает два 400 по Content-Type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHealthNoteInput"
      responses:
        "200":
          description: Записано. Тело пустое.
        "400":
          description: Пустое значение / длиннее 2000 (строка) либо нет отметки (RequiredConsentDto).
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/RequiredConsentDto"
        "401":
          description: Нет токена. Тело пустое.
        "403":
          description: Не сотрудник компании или SuperAdmin. Тело пустое.
        "404":
          description: Клиент не связан с компанией. Тело пустое.
        "451":
          description: Требуется принять новую редакцию документов (в т. ч. TermsOwner).
    delete:
      tags: [health-consent]
      operationId: deleteHealthNote
      summary: Удалить заметку о здоровье (разрешено и без отметки)
      description: |
        Не меняется: идемпотентно 200. Работает И БЕЗ отметки — удаление уменьшает обработку
        спецкатегории (ARCHITECTURE_CYCLE20.md §402.3).
      responses:
        "200":
          description: Удалено или удалять было нечего. Тело пустое.
        "401":
          description: Нет токена. Тело пустое.
        "403":
          description: Не сотрудник компании или SuperAdmin. Тело пустое.
        "404":
          description: Клиент не связан с компанией. Тело пустое.
        "451":
          description: Требуется принять новую редакцию документов.

  /api/companies/{companyId}/clients/{clientKey}/health-consent-form:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/ClientKey"
    get:
      tags: [health-consent]
      operationId: getHealthConsentForm
      summary: Значения для печати бланка письменного согласия (НОВЫЙ)
      description: |
        Текст бланка — GET /api/legal/texts/HealthDataWrittenConsentForm; этот маршрут отдаёт только
        рантайм-значения для data-legal-value и номер бланка. formId новый на каждый запрос и на
        сервере НЕ хранится до отметки. null в runtimeValues = «в системе нет»: фронт печатает линию.
        Паспортных полей нет. Ответ с Cache-Control: no-store.
      responses:
        "200":
          description: Значения для печати.
          headers:
            Cache-Control:
              description: Всегда no-store.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthConsentFormDto"
        "401":
          description: Нет токена. Тело пустое.
        "403":
          description: Не сотрудник компании или SuperAdmin. Тело пустое.
        "404":
          description: Клиент не связан с компанией. Тело пустое.
        "451":
          description: Требуется принять новую редакцию документов.
        "503":
          description: Правовые документы временно недоступны. Тело — строка.
          content:
            text/plain:
              schema:
                type: string

  /api/companies/{companyId}/clients/{clientKey}/health-written-consent:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/ClientKey"
    post:
      tags: [health-consent]
      operationId: markWrittenHealthConsent
      summary: Отметить «письменное согласие получено» (НОВЫЙ)
      description: |
        Строка журнала ConsentRecord: DocumentKey = HealthDataWrittenConsentForm, Source = PaperForm,
        автор — сотрудник, без IP и User-Agent. [RequiresOwnerTerms].
        Идемпотентность: живая отметка с тем же formId и той же версией → 200, новой строки нет.
        textVersion ≠ текущей версии бланка → 409 (распечатать заново).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WrittenHealthConsentInput"
      responses:
        "200":
          description: Отметка стоит.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrittenHealthConsentStateDto"
        "400":
          description: confirmed не true либо formId неверного формата. Тело — строка.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Нет токена. Тело пустое.
        "403":
          description: Не сотрудник компании или SuperAdmin. Тело пустое.
        "404":
          description: Клиент не связан с компанией. Тело пустое.
        "409":
          description: Текст бланка обновлён — распечатать и отметить заново. Тело — строка.
          content:
            text/plain:
              schema:
                type: string
        "451":
          description: Требуется принять новую редакцию документов (в т. ч. TermsOwner).
        "503":
          description: Правовые документы временно недоступны. Тело — строка.
          content:
            text/plain:
              schema:
                type: string

  /api/companies/{companyId}/clients/{clientKey}/health-written-consent/revoke:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/ClientKey"
    post:
      tags: [health-consent]
      operationId: revokeWrittenHealthConsent
      summary: Снять отметку о бумажном согласии и удалить заметку (НОВЫЙ)
      description: |
        Снимает ВСЕ живые отметки клиента в этой компании и в той же транзакции удаляет его заметку о
        здоровье в этой компании. Идемпотентно: снимать нечего → 200, revoked = 0.
        [RequiresOwnerTerms] НЕТ — снятие уменьшает обработку.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WrittenHealthConsentRevokeInput"
      responses:
        "200":
          description: Результат снятия.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrittenHealthConsentRevokeResultDto"
        "400":
          description: Неизвестная причина. Тело — строка.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Нет токена. Тело пустое.
        "403":
          description: Не сотрудник компании или SuperAdmin. Тело пустое.
        "404":
          description: Клиент не связан с компанией. Тело пустое.
        "451":
          description: Требуется принять новую редакцию документов.

  /api/companies/{companyId}/clients/{clientKey}/health-consent:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/ClientKey"
    post:
      tags: [health-consent]
      operationId: postSalonHealthConsentGone
      summary: Салонная электронная форма согласия на здоровье — выведена (410)
      deprecated: true
      description: |
        LG1: согласие на сведения о здоровье — только письменное, на бумажном бланке. Маршрут отвечает
        410 Gone со строкой-заменой, тело запроса не читается.
      responses:
        "401":
          description: Нет токена. Тело пустое.
        "410":
          description: Маршрут выведен. Тело — строка с указанием нового порядка.
          content:
            text/plain:
              schema:
                type: string
        "451":
          description: Требуется принять новую редакцию документов.

  /api/billing/operator-details:
    get:
      tags: [billing-owner]
      operationId: getConsentOperatorDetails
      summary: Реквизиты оператора ПДн для бланка (НОВЫЙ)
      description: |
        Только держатель биллинг-аккаунта. missing = fullName или address не заполнены (ИНН
        необязателен). Заполнять не обязательно: бланк печатается и без реквизитов.
      responses:
        "200":
          description: Реквизиты.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentOperatorDetailsDto"
        "401":
          description: Нет токена. Тело пустое.
        "404":
          description: Биллинг-аккаунта нет. Тело пустое.
        "451":
          description: Требуется принять новую редакцию документов.
    put:
      tags: [billing-owner]
      operationId: updateConsentOperatorDetails
      summary: Сохранить реквизиты оператора ПДн (НОВЫЙ)
      description: |
        Пустая строка = null. ФИО — полностью, инициалы не принимаются (ч. 4 ст. 9 152-ФЗ). ИНН — 10
        или 12 цифр.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentOperatorDetailsInput"
      responses:
        "200":
          description: Сохранено.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentOperatorDetailsDto"
        "400":
          description: Инициалы в ФИО, неверный ИНН, превышение длины. Тело — строка.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Нет токена. Тело пустое.
        "404":
          description: Биллинг-аккаунта нет. Тело пустое.
        "451":
          description: Требуется принять новую редакцию документов.

  /api/profile/consents:
    post:
      tags: [profile]
      operationId: submitProfileConsentsCycle20
      summary: Выдать согласие PdnConsent — цель HealthData больше не принимается
      description: |
        Существующий маршрут цикла 5 (allow-list 451). Новое: HealthData в purposes → 400 «согласие
        даётся в салоне на бумажном бланке». Цель в манифесте остаётся ради отзыва ранее данных.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitConsentInput"
      responses:
        "200":
          description: Состояние согласий (форма прежняя).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Не PdnConsent, неизвестная цель или цель HealthData. Тело — строка.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Нет токена. Тело пустое.
        "409":
          description: Документ обновлён — перечитать. Тело — строка.
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: Правовые документы временно недоступны. Тело — строка.
          content:
            text/plain:
              schema:
                type: string

  /api/profile/consents/revoke:
    post:
      tags: [profile]
      operationId: revokeProfileConsentCycle20
      summary: Отозвать согласие — теперь и отметку о бумажном согласии
      description: |
        Существующий маршрут (allow-list 451). documentKey принимает HealthDataWrittenConsentForm
        (companyId обязателен). Отзыв HealthDataConsent в компании снимает и отметки там же; отзыв
        PdnConsent целиком или цели HealthData снимает отметки во всех компаниях. Гейт цикла 16
        действует: без подтверждённого номера отметки по телефону не трогаются (для салонных ключей —
        прежний 400). Ответ не раскрывает, существовали ли данные.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeConsentInput"
      responses:
        "200":
          description: Результат отзыва.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeConsentResponseDto"
        "400":
          description: Неизвестный ключ/цель, нет companyId, номер не подтверждён. Тело — строка.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Нет токена. Тело пустое.

  /api/profile/export:
    get:
      tags: [profile]
      operationId: exportProfileCycle20
      summary: Выгрузка данных субъекта — explanation гейта из манифеста
      description: |
        Существующий маршрут, форма прежняя. guestDataGate.explanation — ПЛОСКИЙ текст раздела «Текст»
        uiText GuestDataGateNotice (абзацы через \n\n, без HTML и без служебной справки юриста).
        Журнал срабатываний гейта в выгрузку НЕ попадает.
      responses:
        "200":
          description: Выгрузка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileExportGatePatch"
        "401":
          description: Нет токена. Тело пустое.

  # ── US-20-02 ─────────────────────────────────────────────────────────────────────────────────────

  /api/admin/billing-accounts/{accountId}/subscription:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    put:
      tags: [admin-billing]
      operationId: assignSubscriptionWithReason
      summary: Назначить тариф/опции — основание обязательно для скрытого тарифа ≠ текущего
      description: |
        Порядок проверок (часть контракта): существующие → тариф-триал → 409 TrialRefusalDto
        (TrialPlanNotAssignableHere) ПЕРВЫМ при любой причине → ManualPlanAssignmentPolicy
        (причина обязательна, когда целевой тариф isPublic = false и отличается от текущего, П3;
        TrialReissue этой ручкой → 400; OperatorErrorCorrection без reasonDetails → 400) →
        прочие существующие. Причина там, где не обязательна, принимается и пишется в журнал.
        ЛОМАЮЩЕЕ для админского фронта.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSubscriptionInput"
