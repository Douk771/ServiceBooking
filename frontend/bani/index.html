<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- bani.ezbook.ru (ARCHITECTURE_CYCLE42.md §42.13.2). The <div id="root"> below is what the deploy smoke looks for.
         Like dom, bani is a Home Screen app — manifest, sw.js (push to staff and guests). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#5A3A22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EZBOOK Бани" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Booking links (/b/<token>) are capability URLs: never leak them through Referer. -->
    <meta name="referrer" content="same-origin" />
    <!-- Stand until the first real bath owners are invited (ARCHITECTURE_CYCLE42.md §42.13.1, Т42-17); nginx sends the same header. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>EZBOOK Бани</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
