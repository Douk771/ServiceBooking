<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: #A9835A; text-decoration: none; }
  a:hover { color: #8F6C46; }
</style>
</helmet>

<div style="font-family: 'Inter', sans-serif; background: #FAF6F0; color: #2B2420; min-height: 100vh;">

  <nav style="position: sticky; top: 0; z-index: 40; background: rgba(250,246,240,0.86); backdrop-filter: blur(10px); border-bottom: 1px solid #E6DCCB;">
    <div style="max-width: 1180px; margin: 0 auto; padding: 0 32px; height: 76px; display: flex; align-items: center; justify-content: space-between;">
      <a href="Home.dc.html" style="display: flex; align-items: center; gap: 12px;">
        <span style="width: 38px; height: 38px; border-radius: 50%; background: #2B2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FAF6F0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.2"></circle><circle cx="6" cy="18" r="2.2"></circle><path d="M8 7.5L20 19M8 16.5L20 5"></path></svg>
        </span>
        <span style="font-family: 'Newsreader', serif; font-size: 21px; color: #2B2420;">ServiceBooking</span>
      </a>
      <div style="display: flex; align-items: center; gap: 28px;">
        <a href="MyVisits.dc.html" style="font-size: 14px; font-weight: 600; color: #2B2420;">Мои визиты</a>
        <a href="Profile.dc.html" style="width: 36px; height: 36px; border-radius: 50%; background: #F1E9DC; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #8F6C46;">ИИ</a>
      </div>
    </div>
  </nav>

  <div style="max-width: 760px; margin: 0 auto; padding: 48px 32px 100px;">
    <h1 style="font-family: 'Newsreader', serif; font-size: 30px; font-weight: 500; margin: 0 0 28px;">Мои визиты</h1>

    <div style="display: inline-flex; gap: 4px; background: #F1E9DC; padding: 4px; border-radius: 100px; margin-bottom: 32px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button onclick="{{ setTab }}" data-tab="{{ t.key }}" style="padding: 9px 18px; border-radius: 100px; border: none; font-size: 13.5px; font-weight: 600; font-family: inherit; cursor: pointer; background: {{ t.bg }}; color: {{ t.color }}; box-shadow: {{ t.shadow }};">{{ t.label }}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 28px;">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
        <div>
          <h3 style="font-size: 12.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #A69A88; margin: 0 0 12px;">{{ g.label }}</h3>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <sc-for list="{{ g.items }}" as="b" hint-placeholder-count="2">
              <div style="background: #fff; border: 1px solid #E6DCCB; border-radius: 18px; padding: 18px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                <div style="text-align: center; background: #F1E9DC; border-radius: 14px; padding: 10px 14px; min-width: 66px; flex-shrink: 0;">
                  <div style="font-size: 11.5px; color: #8F6C46;">{{ b.dateShort }}</div>
                  <div style="font-size: 17px; font-weight: 700; color: #2B2420;">{{ b.time }}</div>
                </div>
                <div style="flex: 1; min-width: 180px;">
                  <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <span style="font-weight: 600; font-size: 14.5px;">{{ b.service }}</span>
                    <span style="font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 100px; background: {{ b.statusBg }}; color: {{ b.statusColor }};">{{ b.statusLabel }}</span>
                  </div>
                  <div style="font-size: 13px; color: #6B5F52; margin-top: 4px;">{{ b.company }} · {{ b.master }}</div>
                  <div style="font-size: 13px; font-weight: 600; color: #8F6C46; margin-top: 2px;">{{ b.price }} ₽</div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-end; flex-shrink: 0;">
                  <sc-if value="{{ b.canCancel }}" hint-placeholder-val="{{ false }}">
                    <button style="padding: 8px 16px; border-radius: 100px; border: 1px solid #EAC5B9; background: #FBEAE4; color: #A6503A; font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer;">Отменить</button>
                  </sc-if>
                  <sc-if value="{{ b.canReview }}" hint-placeholder-val="{{ false }}">
                    <button style="padding: 8px 16px; border-radius: 100px; border: 1px solid #E6DCCB; background: #fff; color: #4A4038; font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer;">★ Оставить отзыв</button>
                  </sc-if>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'all' };

  bookings = [
    { month: 'Июль 2026', dateShort: '27 июл', time: '14:00', service: 'Название услуги', company: 'Название компании', master: 'Имя мастера', price: '2 500', status: 'Confirmed', canCancel: true, canReview: false },
    { month: 'Июль 2026', dateShort: '18 июл', time: '11:30', service: 'Название услуги', company: 'Название компании', master: 'Имя мастера', price: '1 900', status: 'Completed', canCancel: false, canReview: true },
    { month: 'Июнь 2026', dateShort: '30 июн', time: '16:00', service: 'Название услуги', company: 'Название компании', master: 'Имя мастера', price: '3 800', status: 'Completed', canCancel: false, canReview: false },
    { month: 'Июнь 2026', dateShort: '12 июн', time: '10:00', service: 'Название услуги', company: 'Название компании', master: 'Имя мастера', price: '1 200', status: 'Cancelled', canCancel: false, canReview: false },
  ];

  statusMeta = {
    Confirmed: { label: 'Подтверждена', bg: '#E9F1E6', color: '#4B6B4B' },
    Completed: { label: 'Завершена', bg: '#E9EEF3', color: '#52667A' },
    Cancelled: { label: 'Отменена', bg: '#FBEAE4', color: '#A6503A' },
  };

  setTab(e) { this.setState({ tab: e.currentTarget.getAttribute('data-tab') }); }

  renderVals() {
    const tab = this.state.tab;
    const tabDefs = [
      { key: 'all', label: 'Все' },
      { key: 'upcoming', label: 'Предстоящие' },
      { key: 'completed', label: 'Завершённые' },
      { key: 'cancelled', label: 'Отменённые' },
    ];
    const tabs = tabDefs.map(t => ({ ...t, bg: t.key === tab ? '#fff' : 'transparent', color: t.key === tab ? '#2B2420' : '#8F6C46', shadow: t.key === tab ? '0 2px 6px rgba(43,36,32,0.08)' : 'none' }));

    const filtered = this.bookings.filter(b => {
      if (tab === 'all') return true;
      if (tab === 'upcoming') return b.status === 'Confirmed';
      if (tab === 'completed') return b.status === 'Completed';
      if (tab === 'cancelled') return b.status === 'Cancelled';
      return true;
    }).map(b => ({ ...b, statusLabel: this.statusMeta[b.status].label, statusBg: this.statusMeta[b.status].bg, statusColor: this.statusMeta[b.status].color }));

    const monthOrder = [];
    const byMonth = new Map();
    for (const b of filtered) {
      if (!byMonth.has(b.month)) { byMonth.set(b.month, []); monthOrder.push(b.month); }
      byMonth.get(b.month).push(b);
    }
    const groups = monthOrder.map(m => ({ label: m, items: byMonth.get(m) }));

    return { tabs, groups, setTab: (e) => this.setTab(e) };
  }
}

</script>
</body>
</html>
