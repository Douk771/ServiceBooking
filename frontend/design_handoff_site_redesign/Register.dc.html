<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: #A9835A; text-decoration: none; }
  a:hover { color: #8F6C46; }
  input:focus { border-color: #A9835A !important; box-shadow: 0 0 0 3px #F1E9DC; }
</style>
</helmet>

<div style="font-family: 'Inter', sans-serif; background: #FAF6F0; color: #2B2420; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px;">
  <div style="width: 100%; max-width: 440px;">
    <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 40px;">
      <span style="width: 38px; height: 38px; border-radius: 50%; background: #2B2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FAF6F0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.2"></circle><circle cx="6" cy="18" r="2.2"></circle><path d="M8 7.5L20 19M8 16.5L20 5"></path></svg>
      </span>
      <span style="font-family: 'Newsreader', serif; font-size: 21px; color: #2B2420;">ServiceBooking</span>
    </a>

    <div style="background: #fff; border: 1px solid #E6DCCB; border-radius: 24px; padding: 44px; box-shadow: 0 20px 50px rgba(43,36,32,0.06);">
      <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-family: 'Newsreader', serif; font-size: 28px; font-weight: 500; margin: 0 0 8px;">Создать аккаунт</h1>
        <p style="font-size: 14px; color: #6B5F52; margin: 0;">Присоединяйтесь — это бесплатно</p>
      </div>

      <form style="display: flex; flex-direction: column; gap: 18px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div>
            <label style="display: block; font-size: 13px; font-weight: 500; color: #4A4038; margin-bottom: 7px;">Имя</label>
            <input placeholder="Имя" style="width: 100%; box-sizing: border-box; padding: 13px 16px; border-radius: 12px; border: 1px solid #E6DCCB; font-size: 14px; font-family: inherit; outline: none; color: #2B2420;">
          </div>
          <div>
            <label style="display: block; font-size: 13px; font-weight: 500; color: #4A4038; margin-bottom: 7px;">Фамилия</label>
            <input placeholder="Фамилия" style="width: 100%; box-sizing: border-box; padding: 13px 16px; border-radius: 12px; border: 1px solid #E6DCCB; font-size: 14px; font-family: inherit; outline: none; color: #2B2420;">
          </div>
        </div>
        <div>
          <label style="display: block; font-size: 13px; font-weight: 500; color: #4A4038; margin-bottom: 7px;">Телефон</label>
          <input type="tel" placeholder="+7 999 000 00 00" style="width: 100%; box-sizing: border-box; padding: 13px 16px; border-radius: 12px; border: 1px solid #E6DCCB; font-size: 14px; font-family: inherit; outline: none; color: #2B2420;">
        </div>
        <div>
          <label style="display: block; font-size: 13px; font-weight: 500; color: #4A4038; margin-bottom: 7px;">Email (необязательно)</label>
          <input type="email" placeholder="your@email.com" style="width: 100%; box-sizing: border-box; padding: 13px 16px; border-radius: 12px; border: 1px solid #E6DCCB; font-size: 14px; font-family: inherit; outline: none; color: #2B2420;">
        </div>
        <div>
          <label style="display: block; font-size: 13px; font-weight: 500; color: #4A4038; margin-bottom: 7px;">Пароль</label>
          <input type="password" placeholder="Минимум 8 символов" style="width: 100%; box-sizing: border-box; padding: 13px 16px; border-radius: 12px; border: 1px solid #E6DCCB; font-size: 14px; font-family: inherit; outline: none; color: #2B2420;">
        </div>

        <button type="button" style="margin-top: 8px; width: 100%; padding: 15px; border-radius: 100px; border: none; background: #2B2420; color: #FAF6F0; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;">Зарегистрироваться</button>
      </form>

      <p style="text-align: center; font-size: 14px; color: #6B5F52; margin: 28px 0 0;">
        Уже есть аккаунт? <a href="Login.dc.html" style="font-weight: 600;">Войти</a>
      </p>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
