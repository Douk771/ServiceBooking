<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: #A9835A; text-decoration: none; }
  a:hover { color: #8F6C46; }
  input:focus { border-color: #A9835A !important; box-shadow: 0 0 0 3px #F1E9DC; }
</style>
</helmet>

<div style="font-family: 'Inter', sans-serif; background: #FAF6F0; color: #2B2420; min-height: 100vh;">

  <nav style="position: sticky; top: 0; z-index: 40; background: rgba(250,246,240,0.86); backdrop-filter: blur(10px); border-bottom: 1px solid #E6DCCB;">
    <div style="max-width: 1180px; margin: 0 auto; padding: 0 32px; height: 76px; display: flex; align-items: center; justify-content: space-between;">
      <a href="Home.dc.html" style="display: flex; align-items: center; gap: 12px;">
        <span style="width: 38px; height: 38px; border-radius: 50%; background: #2B2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FAF6F0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.2"></circle><circle cx="6" cy="18" r="2.2"></circle><path d="M8 7.5L20 19M8 16.5L20 5"></path></svg>
        </span>
        <span style="font-family: 'Newsreader', serif; font-size: 21px; color: #2B2420;">ServiceBooking</span>
      </a>
      <div style="display: flex; align-items: center; gap: 20px;">
        <a href="Cabinet.dc.html" style="font-size: 14px; font-weight: 500; color: #6B5F52;">Кабинет</a>
        <button style="display: flex; align-items: center; gap: 6px; background: none; border: none; font-size: 14px; font-weight: 500; color: #6B5F52; cursor: pointer; font-family: inherit;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5M21 12H9"></path></svg>
          Выйти
        </button>
      </div>
    </div>
  </nav>

  <div style="max-width: 640px; margin: 0 auto; padding: 44px 32px 100px;">
    <h1 style="font-family: 'Newsreader', serif; font-size: 30px; font-weight: 500; margin: 0 0 28px;">Профиль</h1>

    <!-- Avatar + roles -->
    <div style="background: #fff; border: 1px solid #E6DCCB; border-radius: 20px; padding: 26px; display: flex; align-items: center; gap: 20px; margin-bottom: 18px;">
      <div style="width: 72px; height: 72px; border-radius: 50%; background: #F1E9DC; color: #8F6C46; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; flex-shrink: 0;">ИИ</div>
      <div>
        <p style="font-size: 19px; font-weight: 600; margin: 0 0 4px;">Имя Фамилия</p>
        <p style="font-size: 13.5px; color: #6B5F52; margin: 0 0 10px;">+7 999 000-00-00 · user@example.com</p>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <span style="font-size: 12px; font-weight: 600; background: #F1E9DC; color: #8F6C46; padding: 4px 11px; border-radius: 100px;">Владелец</span>
        </div>
      </div>
    </div>

    <!-- Personal data -->
    <div style="background: #fff; border: 1px solid #E6DCCB; border-radius: 20px; padding: 26px; margin-bottom: 18px;">
      <h2 style="font-size: 15.5px; font-weight: 600; margin: 0 0 18px;">Личные данные</h2>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px;">
        <div>
          <label style="display: block; font-size: 13px; font-weight: 500; color: #4A4038; margin-bottom: 7px;">Имя</label>
          <input value="Имя" style="width: 100%; box-sizing: border-box; padding: 11px 14px; border-radius: 12px; border: 1px solid #E6DCCB; font-size: 14px; font-family: inherit; outline: none; color: #2B2420;">
        </div>
        <div>
          <label style="display: block; font-size: 13px; font-weight: 500; color: #4A4038; margin-bottom: 7px;">Фамилия</label>
          <input value="Фамилия" style="width: 100%; box-sizing: border-box; padding: 11px 14px; border-radius: 12px; border: 1px solid #E6DCCB; font-size: 14px; font-family: inherit; outline: none; color: #2B2420;">
        </div>
      </div>
      <button style="padding: 12px 22px; border-radius: 100px; border: none; background: #2B2420; color: #FAF6F0; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;">Сохранить изменения</button>
    </div>

    <!-- Plan -->
    <div style="background: #fff; border: 1px solid #E6DCCB; border-radius: 20px; padding: 26px; margin-bottom: 18px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
        <h2 style="font-size: 15.5px; font-weight: 600; margin: 0;">Тарифный план</h2>
        <span style="font-size: 12px; font-weight: 600; background: #E9F1E6; color: #4B6B4B; padding: 4px 11px; border-radius: 100px;">Активна</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap;">
        <span style="font-size: 18px; font-weight: 700;">Профессиональный</span>
        <span style="font-size: 14px; font-weight: 600; color: #8F6C46;">2 990 ₽/мес</span>
        <span style="font-size: 12.5px; color: #A69A88;">Оплачен до 24 авг 2026</span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <span style="font-size: 12px; font-weight: 600; background: #E9F1E6; color: #4B6B4B; padding: 4px 11px; border-radius: 100px;">✓ Онлайн-запись</span>
        <span style="font-size: 12px; font-weight: 600; background: #E9F1E6; color: #4B6B4B; padding: 4px 11px; border-radius: 100px;">✓ Рассылка</span>
        <span style="font-size: 12px; font-weight: 600; background: #F5F2EC; color: #A69A88; padding: 4px 11px; border-radius: 100px;">✗ Аналитика</span>
      </div>
    </div>

    <!-- Password -->
    <div style="background: #fff; border: 1px solid #E6DCCB; border-radius: 20px; padding: 26px;">
      <h2 style="font-size: 15.5px; font-weight: 600; margin: 0 0 18px;">Смена пароля</h2>
      <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px;">
        <div>
          <label style="display: block; font-size: 13px; font-weight: 500; color: #4A4038; margin-bottom: 7px;">Текущий пароль</label>
          <input type="password" style="width: 100%; box-sizing: border-box; padding: 11px 14px; border-radius: 12px; border: 1px solid #E6DCCB; font-size: 14px; font-family: inherit; outline: none;">
        </div>
        <div>
          <label style="display: block; font-size: 13px; font-weight: 500; color: #4A4038; margin-bottom: 7px;">Новый пароль</label>
          <input type="password" style="width: 100%; box-sizing: border-box; padding: 11px 14px; border-radius: 12px; border: 1px solid #E6DCCB; font-size: 14px; font-family: inherit; outline: none;">
        </div>
      </div>
      <button style="padding: 12px 22px; border-radius: 100px; border: none; background: #fff; color: #2B2420; border: 1px solid #E6DCCB; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;">Изменить пароль</button>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
