services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: servicebooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No host port published — only the api container can reach it, over the compose network.

  api:
    build:
      context: .
      dockerfile: ServiceBooking.API/Dockerfile
    # Explicit, stable image name/tag (T-D3, US-44, ARCHITECTURE.md §12.3) — without this, compose
    # derives the tag from the checkout directory name, which rollback.sh would have to guess. Rebuilds
    # write here on every `up -d --build`; deploy-remote.sh tags THIS name `:previous` before rebuilding,
    # and rollback.sh's whole "one command" trick is `docker tag servicebooking-api:previous
    # servicebooking-api:latest && up -d` — no rebuild involved.
    image: servicebooking-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"   # bound to localhost only; nginx on the host proxies to it
    # Домашний роутер не разворачивает трафик на себя (нет hairpin NAT): обращение к
    # errors.ezbook.ru изнутри сети уходит на белый адрес и не возвращается. Sentry-клиент при этом
    # НЕ падает — он молча теряет события, и трекер выглядит пустым, как будто ошибок нет
    # (обнаружено при развёртывании 2026-09-17). Отправляем имя на хост, где его слушает nginx;
    # TLS при этом валиден, потому что SNI и сертификат совпадают по имени.
    extra_hosts:
      - "errors.ezbook.ru:host-gateway"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=servicebooking;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=ServiceBooking
      - Jwt__Audience=ServiceBookingClient
      - AllowedOrigins=https://${DOMAIN},https://www.${DOMAIN}
      - SuperAdmin__Phone=${SUPERADMIN_PHONE}
      - SuperAdmin__Password=${SUPERADMIN_PASSWORD}
      - SmartCaptcha__SecretKey=${SMARTCAPTCHA_SECRET_KEY}
      - SmartCaptcha__SiteKey=${SMARTCAPTCHA_SITE_KEY}
      - ASPNETCORE_ENVIRONMENT=Production
      # Private storage class for client-note photos (ARCHITECTURE.md §3): must never resolve inside
      # wwwroot/uploads (the public class, api_uploads below) — the API fail-fasts on startup if it does.
      - Storage__PrivateRoot=/app/private-uploads
      # Docker bridge subnet compose assigns this stack (ARCHITECTURE.md §9.1) — the only hop the rate
      # limiter is allowed to trust X-Forwarded-For from. Empty/unset -> fail-fast on startup (US-48).
      - ForwardedHeaders__TrustedNetworks__0=${FORWARDEDHEADERS__TRUSTEDNETWORKS__0}
      # GlitchTip DSN (T-D4, US-45, docker-compose.glitchtip.yml). Empty on purpose until GlitchTip is
      # provisioned — the Sentry.Serilog sink simply doesn't register when this is blank
      # (ARCHITECTURE.md §11.4), the app runs the same either way.
      - Sentry__Dsn=${SENTRY_DSN:-}
      - Sentry__Release=${GIT_SHA:-}
      # Six Notifications__* variables, final names per ARCHITECTURE_CYCLE4.md §37 — mirrors the
      # Jwt__Key=${JWT_KEY} convention above. NOTIFICATIONS_ENCRYPTION_KEY is NOT a routine secret:
      # regenerating it is an irreversible loss of every salon's WhatsApp channel, see DEPLOY.md
      # "Инвентарь секретов" (separate line, not lumped in with `openssl rand`-rotated secrets) and
      # the rotation procedure there. Empty NOTIFICATIONS_PROVIDER/logging default keeps the app
      # running with the no-op transport until a provider is deliberately configured.
      - Notifications__EncryptionKey=${NOTIFICATIONS_ENCRYPTION_KEY:-}
      - Notifications__KeyRotationAck=${NOTIFICATIONS_KEY_ROTATION_ACK:-}
      - Notifications__Provider=${NOTIFICATIONS_PROVIDER:-logging}
      - Notifications__PartnerToken=${NOTIFICATIONS_PARTNER_TOKEN:-}
      # ARCHITECTURE_CYCLE9.md §104.1/§104.9 — MAX is a separate GREEN-API product/account from
      # WhatsApp, so it needs its own partner token, checked by the same fail-fast rules.
      - Notifications__GreenApiMax__PartnerToken=${NOTIFICATIONS_GREENAPI_MAX_PARTNER_TOKEN:-}
      - Notifications__WebhookToken=${NOTIFICATIONS_WEBHOOK_TOKEN:-}
      - Notifications__UnsubscribeKey=${NOTIFICATIONS_UNSUBSCRIBE_KEY:-}
      # ARCHITECTURE_CYCLE9.md §105 (проход C, Web Push мастеру) — own provider switch/secret, empty
      # WEBPUSH_STAFFPUSH_PROVIDER/logging default keeps the subsystem off exactly like
      # NOTIFICATIONS_PROVIDER/logging above.
      - Notifications__StaffPush__Provider=${WEBPUSH_STAFFPUSH_PROVIDER:-logging}
      - Notifications__StaffPush__VapidPublicKey=${WEBPUSH_VAPID_PUBLIC_KEY:-}
      - Notifications__StaffPush__VapidPrivateKey=${WEBPUSH_VAPID_PRIVATE_KEY:-}
      - Notifications__StaffPush__VapidSubject=${WEBPUSH_VAPID_SUBJECT:-}
      # Retention (ARCHITECTURE_CYCLE5.md §49, DEPLOY.md §11.4): appsettings.json bakes DryRun=true —
      # deletion-by-age rules only log what they WOULD delete until this is deliberately flipped to
      # false on the host, per the two-run procedure in DEPLOY.md. Empty/unset keeps the baked-in
      # default (dry run) — same fail-safe shape as NOTIFICATIONS_PROVIDER above.
      - ScheduledTasks__data-retention__DryRun=${RETENTION_DRY_RUN:-true}
    volumes:
      - api_uploads:/app/wwwroot/uploads          # public class: company logos, avatars, service images
      - api_private_uploads:/app/private-uploads  # private class: client-note photos — back this up separately, it holds personal data
      - api_logs:/app/logs                        # Serilog file sink (ARCHITECTURE.md §11.1) — not backed up, it's a disposable diagnostic, not data
      - ./legal:/app/App_Data/legal:ro             # bind-mount OVER the baked-in draft (ARCHITECTURE.md §4.1): edit files on the host, no rebuild/redeploy needed
      # WRITABLE bind-mount (no :ro, unlike ./legal above) — the app writes its own master-key
      # fingerprint file here on first successful start and compares against it on every start after
      # (ARCHITECTURE_CYCLE4.md §24.5). Must be a host bind-mount, not a named volume: a named volume
      # is exactly as ephemeral to "recreate the container" as the container's own filesystem in the
      # failure mode this exists to catch, and deploy-remote.sh's `up -d --build` recreates the
      # container on every deploy. On the host, create ./state (mode 0700, owned by the user docker
      # runs as / the container's uid so the dotnet process inside can write to it) BEFORE first
      # `docker compose up` — see DEPLOY.md §3/§4 for the exact command. `state/` is gitignored, same
      # treatment as `.env`: it is host-local operator data, not something the repo checkout owns.
      - ./state:/app/App_Data/state
    # /api/health/live never touches the database (ARCHITECTURE.md §10.1), so this only tells docker
    # "the process is up and answering HTTP" — readiness (DB + migrations) is what deploy-remote.sh /
    # rollback.sh poll separately after a restart (T-D3). start_period is generous on purpose: it has to
    # cover EF Core applying pending migrations on startup (Program.cs -> MigrateAsync()).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

# Health-check reference (T-D7, US-43, ARCHITECTURE.md §10.3) — see DEPLOY.md for the full writeup:
#   curl -s https://<домен>/api/health/ready
#     {"status":"Healthy"}                          — можно деплоить/поднимать нагрузку
#     {"status":"Unhealthy","failed":"database"}     — БД недоступна ИЛИ остались непринятые миграции
#     нет ответа / connection refused                — процесс не поднялся вовсе (смотрите `docker compose logs api`)

volumes:
  postgres_data:
  api_uploads:
  api_private_uploads:
  api_logs:
