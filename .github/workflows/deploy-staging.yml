name: Deploy staging (develop)

# Push-button deploy of `develop` to the customer's one machine, used as the continuous dev/staging
# environment (DEPLOY.md §0.0/§9). GitHub-hosted runner — it never holds anything but the SSH key
# needed to reach that box; no application secrets (.env, JWT key, Postgres password, superadmin
# password, SmartCaptcha secret) ever pass through GitHub. Manual trigger only, on purpose: this is a
# "push the button when you want it live", not "every push to develop goes out automatically".
#
# BEFORE the first run of this workflow: the target machine needs Docker, nginx and the `ezbookdeploy`
# system user set up by hand — see DEPLOY.md §1 and §1.4. This workflow does not bootstrap an empty
# machine, only ships new releases to one that already has the stack running once (§8/§9 of DEPLOY.md).
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce ref == develop
        run: |
          if [ "${{ github.ref }}" != "refs/heads/develop" ]; then
            echo "::error::This workflow only deploys the develop branch. You ran it with 'Use workflow from' set to '${{ github.ref_name }}' (${{ github.ref_type }}) — switch that dropdown to the develop branch and re-run. Production deploys are a separate workflow (deploy-production.yml), gated on a tag on master, not this one."
            exit 1
          fi

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Same VITE_SMARTCAPTCHA_SITEKEY repo Variable ci.yml's frontend job already uses (public site
      # key, not the secret — DEPLOY.md §5). Built HERE, on the runner, never on the target machine.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SMARTCAPTCHA_SITEKEY: ${{ vars.VITE_SMARTCAPTCHA_SITEKEY }}
        run: npm run build

      - name: Set up deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            # Preferred path: DEPLOY_HOST_KEY is the output of `ssh-keyscan` run ONCE by a human who
            # already trusts the machine (e.g. over the console, or a connection verified out of band),
            # pinned as a repo Variable — see DEPLOY.md §9.1. Avoids trust-on-first-use over the
            # network from an ephemeral, untrusted-by-default GitHub-hosted runner.
            printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_HOST_KEY is not set — falling back to ssh-keyscan (trust-on-first-use, see DEPLOY.md §9.1 residual risk). Set the DEPLOY_HOST_KEY repo Variable to remove this warning."
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Ship release and deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes"
          RELEASE_TS="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "==> Uploading frontend build as release $RELEASE_TS"
          tar -C frontend/dist -czf - . | $SSH "$DEPLOY_USER@$DEPLOY_HOST" "upload-release $RELEASE_TS"
          echo "==> Deploying commit ${{ github.sha }} as release $RELEASE_TS"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "deploy ${{ github.sha }} $RELEASE_TS"
