name: CI

on:
  push:
    branches: [master, release-candidate, develop, 'cycle/**', 'fix/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Cycle 8 (ARCHITECTURE_CYCLE8.md §69.2, §74.1): this is a connection string to the SERVER, not a
      # database — the test run picks its own per-run, per-slot database names (sbtest_<key>_<slot>)
      # and always rewrites the Database component to "postgres" itself. Simplified here to say so
      # plainly; the old value (Database=servicebooking_test) would have kept working unchanged.
      SERVICEBOOKING_TEST_CONNECTION: "Host=localhost;Database=postgres;Username=postgres;Password=postgres"
      # ARCHITECTURE_CYCLE8_PHASE2.md §93.1/§93.4 (T8-P8): CI runs at P=2, not xunit.runner.json's local
      # default of 4 (2 CI cores vs. 4 on a dev machine, §93.1) -- via `-- xUnit.MaxParallelThreads=2`
      # below. TestParallelism.cs cannot see that command-line value in-process (no in-process API to
      # read it back), so this env var is the second, independent place that has to say the same "2" --
      # it is what the connection-budget fail-fast (§93.4) actually uses. If these two ever disagree,
      # TestParallelism.cs prints the value it used so the drift is visible in the CI log, not silent.
      SERVICEBOOKING_TEST_MAX_PARALLEL_THREADS: "2"
    steps:
      - uses: actions/checkout@v5

      # Optional correlation (ARCHITECTURE_CYCLE8.md §74.1): sets SERVICEBOOKING_TEST_RUN_KEY so this
      # run's database/container names show up tagged with this CI run's id in logs. Not required for
      # correctness — without it TestRunKey.Current falls back to a random key (TestRunKey.cs) — but the
      # variable's contract (API_CONTRACT_CYCLE8.md §85.1) is strict: exactly 8 lowercase hex chars. A
      # raw `github.run_id` (a decimal id of varying length) does NOT satisfy that and would make
      # TestRunKey throw at process start, so it's folded into 8 hex digits here rather than passed
      # through as-is.
      #
      # Review finding N17: GITHUB_RUN_ID alone is the same for every job of one workflow run, so two
      # jobs (or, per TestDatabaseLease's N2 fix, two jobs racing on a shared external Postgres) would
      # derive the identical run key and could collide on the same sbtest_<key>_<slot> database names.
      # Folding in GITHUB_JOB (a per-job constant) makes the key differ per job while staying stable and
      # traceable from the CI log for a single job's own re-runs.
      - name: Derive test run key
        run: |
          job_hash="$(printf '%s' "$GITHUB_JOB" | cksum | cut -d' ' -f1)"
          printf 'SERVICEBOOKING_TEST_RUN_KEY=%08x\n' "$(( (GITHUB_RUN_ID ^ job_hash) % 4294967296 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ServiceBooking.sln

      # -warnaserror only goes on now that the Blazor template project (which carried its own warning)
      # is out of the solution — US-22, ARCHITECTURE.md §16/§19 T-B17.
      - name: Build
        run: dotnet build ServiceBooking.sln --no-restore -c Release -warnaserror

      # Fast, no-DB suite runs first so a broken build/pure-logic regression fails quickly, before
      # spending time on the functional suite against Postgres.
      - name: Unit tests
        run: dotnet test ServiceBooking.UnitTests --no-build -c Release

      - name: Functional tests
        run: dotnet test ServiceBooking.Tests --no-build -c Release -- xUnit.MaxParallelThreads=2

      # Fast bash check (ARCHITECTURE_CYCLE8.md §74.1/§74.3): fails if the Postgres image's major
      # version drifts between ServiceBooking.TestKit/TestInfrastructure.cs, docker-compose.yml,
      # docker-compose.prod.yml and this file.
      - name: Check image pins
        run: bash deploy/ci/check-image-pins.sh

      # ARCHITECTURE_CYCLE17.md §308.2, authoritative check: asks EF Core itself whether
      # AppDbContextModelSnapshot.cs matches the current model by generating a throwaway migration —
      # a non-empty Up() means the two have drifted (this is what caught C15-4). Requires only the
      # design-time model, no live database connection.
      - name: Migrations snapshot drift (US-17-11)
        run: |
          dotnet tool restore
          dotnet dotnet-ef migrations add __DriftProbe --project ServiceBooking.Infrastructure \
            --startup-project ServiceBooking.API --output-dir Migrations/__probe
          probe_file=$(ls ServiceBooking.Infrastructure/Migrations/__probe/*__DriftProbe.cs)
          # Скрипт лежит файлом, а не инлайном: встроенный сюда python с первой колонки
          # обрывает блочный скаляр YAML, и GitHub отказывается разбирать весь workflow.
          python3 deploy/ci/check-drift-probe.py "$probe_file"
          dotnet dotnet-ef migrations remove --project ServiceBooking.Infrastructure --startup-project ServiceBooking.API
          rm -rf ServiceBooking.Infrastructure/Migrations/__probe

      # ARCHITECTURE_CYCLE17.md §308.2, cheap check: catches ROUGHLY the C15-4 shape of bug (a
      # Designer.cs losing properties a later one and today's snapshot both have) with a plain-text
      # walk, no dotnet-ef invocation. Pinpoints which migration/entity/property regressed.
      - name: Designer snapshots are monotonic (C15-4)
        run: bash deploy/ci/check-migration-snapshots.sh

      # ARCHITECTURE_CYCLE11.md §105.2/§117.3: `legal check` builds legal-drafts/ into a temp dir and
      # compares it byte-for-byte against the committed ServiceBooking.API/App_Data/legal artifact, then
      # checks internal links/anchors, then scans the drafts for a placeholder written in a form the
      # product's own regex wouldn't recognize (risk A4). Exit 3 = artifact drift, 6 = broken link/anchor
      # or an unrecognized placeholder form — either way this is the step that's expected to go red until
      # T0 (marker in legal-drafts/09-channel-offer.html) and T8 (App_Data/legal replaced from the new
      # drafts) both land; see the cycle 11 backend report for T1/T3/T7.
      - name: Legal documents check
        run: dotnet ServiceBooking.LegalKit/bin/Release/net8.0/ServiceBooking.LegalKit.dll check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # ARCHITECTURE_CYCLE17.md §310 п.4 / API_CONTRACT_CYCLE17.md §328 п.9 (долг C15-10).
      # Генераты лежат в репозитории, поэтому расходятся со схемой молча: контракт правят,
      # регенерацию забывают, и типы описывают вчерашний API. Именно это и случилось внутри
      # цикла 17 — схему поправили дважды, генерат остался от первого коммита. Шаг
      # перегенерирует и падает, если результат отличается от закоммиченного.
      - name: Generated API types must match the contracts
        run: |
          npm run types:api:cycle15
          npm run types:api:cycle17
          git diff --exit-code -- src/types/api-cycle15.generated.ts src/types/api-cycle17.generated.ts

      # Цикл 17: тексты правовых уведомлений пишет legal-counsel, а каркас кода появляется
      # раньше текста. Заглушка видна владельцу на экране «Ваша подписка», поэтому её нельзя
      # довезти до develop молча — в цикле 15 ровно так и вышло (юрист отчитался, файл остался).
      - name: No placeholder legal copy
        run: |
          if grep -rn "ТРЕБУЕТСЯ ТЕКСТ ОТ LEGAL-COUNSEL" ../ServiceBooking.API/Services/; then
            echo "::error::Заглушка правового текста дошла до CI — заменить на текст от legal-counsel"
            exit 1
          fi

      # ARCHITECTURE_CYCLE9.md §105.9 (R11) — the staff push service worker must never gain a `fetch`
      # listener or touch the Cache API: that is the mechanical guarantee that it cannot intercept a
      # navigation and strand a browser on a stale build. Three tokens, cheap insurance against a week
      # of "why is the site not updating" debugging.
      - name: Service worker must not intercept fetch/cache (R11)
        run: |
          if grep -nE "addEventListener\s*\(\s*['\"\`]fetch|\bcaches\b|CacheStorage" public/sw.js; then
            echo "public/sw.js must never register a fetch handler or use the Cache API (ARCHITECTURE_CYCLE9.md §105.9, R11)" >&2
            exit 1
          fi

      - name: Unit tests
        run: npm run test:run

      # SmartCaptcha SITE key (not the secret key — site keys are meant to be public, they're baked into
      # every page that shows the widget) is a build-time Vite variable (CURRENT_STATE.md §1), so it has
      # to be present HERE, not on the VPS, now that the VPS never runs `npm run build` at all (T-D3).
      # Configure it once: repo Settings -> Secrets and variables -> Actions -> Variables ->
      # VITE_SMARTCAPTCHA_SITEKEY. Empty/unset is fine for CI's own tests (the captcha widget just won't
      # render), but the deployed build needs a real value or registration/booking forms show no captcha.
      - name: Build
        env:
          VITE_SMARTCAPTCHA_SITEKEY: ${{ vars.VITE_SMARTCAPTCHA_SITEKEY }}
        run: npm run build

      # US-112 (ARCHITECTURE_CYCLE9.md §103.2): proves the tab icon is actually reachable over HTTP from
      # the built dist/ - a request, not a glance at frontend/public/ in source. Runs from the repo root
      # (working-directory: frontend does not apply to run: shell commands' cwd for this step by
      # default, so cd explicitly) against the artifact this job is about to upload.
      - name: Smoke test (favicon served from built dist)
        working-directory: .
        run: bash deploy/ci/smoke-frontend.sh
        env:
          DIST_DIR: frontend/dist

      # Frontend build moves off the production server entirely (T-D3, US-44, ARCHITECTURE.md §12.3):
      # deploy/deploy.sh downloads this artifact and ships it to the VPS instead of running `npm ci &&
      # npm run build` on the box being served from. 30-day retention matches the number of recent
      # releases anyone would plausibly want to roll back to by hand.
      - name: Upload frontend dist
        # Ветки, с которых вообще деплоят (см. модель веток в DEPLOY.md). deploy/deploy.sh
        # скачивает этот артефакт по имени, так что ветка без него ломает локальный деплой.
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release-candidate' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 30

  # Builds the image AND actually runs it (T-D1, US-41, ARCHITECTURE.md §12.2) — plain `dotnet
  # build`/`dotnet run` never touches the published container, so nothing here previously caught either
  # of these classes of bug:
  #   - SkiaSharp.NativeAssets.Linux.NoDependencies (ARCHITECTURE.md §2.1) only loads on a glibc base
  #     image; a Dockerfile that quietly regressed to an -alpine tag would build fine and only crash
  #     inside a real container;
  #   - files that exist on disk in the repo but don't ship in the *published* output (wrong `Content`
  #     glob in a .csproj, missing COPY, etc.) — `dotnet run` reads straight from the source tree and
  #     never notices.
  # Runs entirely on GitHub's own Docker Engine — nothing is pushed anywhere, no external services.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build -f ServiceBooking.API/Dockerfile -t servicebooking-api:ci .

      - name: Start Postgres
        run: |
          docker network create ci-smoke
          docker run -d --name pg-smoke --network ci-smoke \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=servicebooking \
            --health-cmd "pg_isready -U postgres" \
            --health-interval 2s \
            --health-timeout 3s \
            --health-retries 20 \
            --health-start-period 5s \
            postgres:16-alpine

      # The API applies EF Core migrations on startup (Program.cs -> MigrateAsync(), line ~518) —
      # if it dials Postgres before Postgres is actually accepting TCP connections (container "running"
      # is not the same as "ready"; initdb + first-boot init can take a couple seconds), it throws
      # Npgsql "Failed to connect" and exits. `docker run -d` only waits for the process to start, not
      # for the --health-cmd above to report healthy — so that has to be polled explicitly here, same
      # as docker-compose.yml/docker-compose.prod.yml already do via `depends_on: condition:
      # service_healthy` (those aren't racy; only this job's raw `docker run` sequence was).
      - name: Wait for Postgres to be healthy
        run: |
          deadline=$((SECONDS + 60))
          while true; do
            status=$(docker inspect --format='{{.State.Health.Status}}' pg-smoke 2>/dev/null || echo unknown)
            running=$(docker inspect --format='{{.State.Running}}' pg-smoke 2>/dev/null || echo false)
            if [ "$status" = "healthy" ]; then
              echo "pg-smoke is healthy"
              break
            fi
            # Fail fast instead of waiting out the full 60s timeout: a container that has already
            # exited (crashed, port conflict, broken image) or reports "unhealthy" will never become
            # healthy on its own, so there is nothing to wait for.
            if [ "$status" = "unhealthy" ] || [ "$running" != "true" ]; then
              echo "::error::pg-smoke is not going to become healthy (health status: $status, running: $running)"
              echo "---- pg-smoke logs ----"
              docker logs pg-smoke || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::pg-smoke did not become healthy within 60s (last status: $status)"
              echo "---- pg-smoke logs ----"
              docker logs pg-smoke || true
              exit 1
            fi
            sleep 1
          done

      # Runs the image as ASPNETCORE_ENVIRONMENT=Production on purpose (US-41 п.5 leaves the choice to
      # the architect, ARCHITECTURE.md §12.2): this doubles as proof that the fail-fast checks (US-48)
      # are satisfied by exactly the env vars documented in DEPLOY.md/.env.production.example, and that
      # the list there is complete — if a new required variable is added later without updating this
      # step, the job goes red, which is the point, not an inconvenience.
      - name: Start API container (Production)
        run: |
          docker run -d --name api-smoke --network ci-smoke -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ConnectionStrings__DefaultConnection="Host=pg-smoke;Database=servicebooking;Username=postgres;Password=postgres" \
            -e Jwt__Key="$(openssl rand -base64 48)" \
            -e Jwt__Issuer=ServiceBooking \
            -e Jwt__Audience=ServiceBookingClient \
            -e AllowedOrigins=http://localhost:5173 \
            -e SuperAdmin__Phone=+79990000000 \
            -e SuperAdmin__Password="Ci$(openssl rand -hex 8)Aa1" \
            -e Storage__PrivateRoot=/app/private-uploads \
            -e ForwardedHeaders__TrustedNetworks__0=172.16.0.0/12 \
            servicebooking-api:ci

      - name: Smoke test (health, register, avatar upload — exercises SkiaSharp for real)
        run: BASE_URL=http://localhost:8080 bash deploy/ci/smoke.sh

      - name: Container logs (always, so a smoke failure shows the actual crash/exception)
        if: always()
        run: |
          echo "---- api-smoke logs ----"
          docker logs api-smoke || true
          echo "---- pg-smoke logs ----"
          docker logs pg-smoke || true
