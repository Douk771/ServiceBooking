name: CI

on:
  push:
    branches: [master, sanitation-cycle]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SERVICEBOOKING_TEST_CONNECTION: "Host=localhost;Database=servicebooking_test;Username=postgres;Password=postgres"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ServiceBooking.sln

      # -warnaserror only goes on now that the Blazor template project (which carried its own warning)
      # is out of the solution — US-22, ARCHITECTURE.md §16/§19 T-B17.
      - name: Build
        run: dotnet build ServiceBooking.sln --no-restore -c Release -warnaserror

      # Fast, no-DB suite runs first so a broken build/pure-logic regression fails quickly, before
      # spending time on the functional suite against Postgres.
      - name: Unit tests
        run: dotnet test ServiceBooking.UnitTests --no-build -c Release

      - name: Functional tests
        run: dotnet test ServiceBooking.Tests --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  # Doesn't run the container or hit any endpoint — just proves the image actually builds. This matters
  # specifically because of SkiaSharp.NativeAssets.Linux.NoDependencies (ARCHITECTURE.md §2.1): it only
  # loads on a glibc base image, so a Dockerfile that quietly regressed to an -alpine tag, or a native
  # asset that failed to publish, would build fine with plain `dotnet build`/`dotnet run` and only fail
  # here or in a real container. Runs on GitHub's own Docker Engine — nothing is pushed anywhere.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f ServiceBooking.API/Dockerfile -t servicebooking-api:ci .
