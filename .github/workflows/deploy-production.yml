name: Deploy production (tag on master)

# Push-button PRODUCTION deploy. Deliberately separate from deploy-staging.yml, not a parameter of it
# (DEPLOY.md §0.0/§9): this one only ever runs against a git TAG that is actually reachable from
# `master`, so the button cannot ship an arbitrary branch/commit to production even if someone fat-
# fingers the "Use workflow from" ref picker. Release flow stays: develop -> release-candidate -> QA
# regression -> merge to master -> tag -> THIS workflow, run against that tag.
#
# GitHub Environment `production` should have required reviewers configured (Settings -> Environments
# -> production -> Deployment protection rules -> Required reviewers) — that's a manual one-time repo
# setting, not something this file can turn on by itself; see DEPLOY.md §9 for the exact steps.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly 'deploy' to confirm — this ships to the real production machine."
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm phrase matches
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::Confirmation input must be exactly 'deploy'. Refusing to run."
            exit 1
          fi

      - name: Enforce ref is a tag reachable from master
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::This workflow only deploys tags. You ran it with 'Use workflow from' set to '${{ github.ref_name }}' (${{ github.ref_type }}) — pick a version tag instead (e.g. v1.2.0), created on master after QA regression on release-candidate (see DEPLOY.md §0.0). Staging deploys are the separate deploy-staging.yml workflow, not this one."
            exit 1
          fi
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
            echo "::error::Tag '${{ github.ref_name }}' (commit ${{ github.sha }}) is not an ancestor of origin/master. Refusing to deploy a tag that was created off some other branch — see DEPLOY.md §0.0, production only ever receives code via release-candidate -> master."
            exit 1
          fi
          echo "OK: ${{ github.ref_name }} is on master."

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    # Required reviewers on this Environment (configured in repo Settings, see the header comment
    # above) are what actually turns "push the button" into "push the button, someone else approves,
    # then it runs" for production specifically — deploy-staging.yml intentionally has no such gate.
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SMARTCAPTCHA_SITEKEY: ${{ vars.VITE_SMARTCAPTCHA_SITEKEY }}
        run: npm run build

      - name: Set up deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_HOST_KEY is not set — falling back to ssh-keyscan (trust-on-first-use). Set the DEPLOY_HOST_KEY repo Variable to remove this warning."
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Ship release and deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes"
          RELEASE_TS="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "==> Uploading frontend build as release $RELEASE_TS (tag ${{ github.ref_name }})"
          tar -C frontend/dist -czf - . | $SSH "$DEPLOY_USER@$DEPLOY_HOST" "upload-release $RELEASE_TS"
          echo "==> Deploying commit ${{ github.sha }} as release $RELEASE_TS"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "deploy ${{ github.sha }} $RELEASE_TS"
